  touch-action:manipulation;
}

/* ---------- Hintergrund: schwebende Kerzen ---------- */
#kerzen{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.kerze{position:absolute;width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle,#FFE9A8 0%,#E8A33A 35%,rgba(232,163,58,0) 70%);
  filter:blur(.3px);animation:schweben linear infinite;opacity:.85}
.kerze::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,163,58,.28) 0%,rgba(232,163,58,0) 65%)}
@keyframes schweben{
  0%{transform:translateY(12vh) translateX(0) scale(.7);opacity:0}
  10%{opacity:.9}
  50%{transform:translateY(-40vh) translateX(14px) scale(1)}
  90%{opacity:.7}
  100%{transform:translateY(-95vh) translateX(-10px) scale(.75);opacity:0}
}

/* ---------- Grundlayout ---------- */
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;overflow:hidden}
.szene{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.szene.aktiv{display:flex}
.rollen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px 14px 26px}
.mitte{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;overflow-y:auto}

/* ---------- Typografie ---------- */
h1,h2,h3{margin:0 0 .4em}
.gotisch{font-family:'Grenze Gotisch',serif;font-weight:400;letter-spacing:.5px;line-height:1.05}
.serif{font-family:'Newsreader',serif;font-weight:700}
.hand{font-family:'Caveat',cursive;font-weight:600}
.klein{font-size:.82rem}
.blass{color:var(--tinte-blass)}
.gold{color:var(--messing-hell)}
.zentriert{text-align:center}

/* ---------- Pergament-Fläche ---------- */
.blatt{
  position:relative;background:var(--pergament);color:var(--tinte-schrift);
  border-radius:var(--r-m);padding:18px 16px;
  border:2px solid var(--messing);
  box-shadow:var(--schatten), inset 0 0 60px rgba(160,130,70,.18);
}
.blatt::before{content:'';position:absolute;inset:0;border-radius:inherit;background-image:var(--papier);pointer-events:none;mix-blend-mode:multiply}
.blatt.liniert::after{content:'';position:absolute;left:0;right:0;top:0;bottom:0;border-radius:inherit;pointer-events:none;
  background:repeating-linear-gradient(180deg,transparent 0 27px,rgba(40,60,110,.10) 27px 28px);
  mask-image:linear-gradient(180deg,transparent 0,#000 40px,#000 calc(100% - 20px),transparent 100%);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 40px,#000 calc(100% - 20px),transparent 100%)}
.blatt .rand{position:absolute;left:34px;top:0;bottom:0;width:1px;background:rgba(192,73,46,.30)}

/* Klebeband */
.band{position:absolute;width:76px;height:22px;background:rgba(233,222,180,.72);
  border-left:1px dashed rgba(0,0,0,.10);border-right:1px dashed rgba(0,0,0,.10);
  box-shadow:0 2px 6px rgba(0,0,0,.16);top:-11px}
.band.l{left:16px;transform:rotate(-6deg)}
.band.r{right:16px;transform:rotate(5deg)}

/* ---------- Buttons ---------- */
.btn{
  font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;
  color:var(--tinte);background:linear-gradient(180deg,var(--messing-hell),var(--messing));
  border:2px solid #8E7318;border-radius:999px;padding:13px 22px;cursor:pointer;
  box-shadow:0 4px 0 #7A6216, 0 10px 22px rgba(201,162,39,.28);
  transition:transform .08s ease, box-shadow .08s ease, filter .15s ease;
  min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7A6216, 0 5px 12px rgba(201,162,39,.22)}
.btn:disabled{filter:grayscale(.6) brightness(.85);cursor:default;box-shadow:none}
.btn.haus{background:linear-gradient(180deg,var(--haus2),var(--haus));border-color:rgba(0,0,0,.35);color:#12162C;box-shadow:0 4px 0 rgba(0,0,0,.3),0 10px 22px rgba(0,0,0,.25)}
.btn.geist{background:transparent;color:var(--mondstein);border:2px solid rgba(221,229,248,.35);box-shadow:none;font-weight:700}
.btn.geist:active{transform:translateY(2px)}
.btn.klein{padding:9px 15px;font-size:.88rem;min-height:40px}
.btn.voll{width:100%}
:focus-visible{outline:3px solid var(--mondstein);outline-offset:3px;border-radius:8px}

/* ---------- Kopfleiste ---------- */
.kopf{
  display:flex;align-items:center;gap:9px;padding:9px 12px;
  background:linear-gradient(180deg,rgba(31,27,61,.96),rgba(19,26,51,.92));
  border-bottom:2px solid var(--haus);flex:0 0 auto;box-shadow:0 6px 18px rgba(0,0,0,.35)
}
.kopf .wappen{width:34px;height:34px;flex:0 0 auto}
.kopf .wer{min-width:0;flex:1}
.kopf .nam{font-weight:800;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kopf .rang{font-size:.72rem;color:var(--haus2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muenzen{display:flex;align-items:center;gap:5px;font-weight:800;color:var(--messing-hell);
  background:rgba(0,0,0,.28);border:1px solid rgba(201,162,39,.45);border-radius:999px;padding:6px 11px;font-size:.9rem}
.ikon-btn{width:40px;height:40px;flex:0 0 auto;border-radius:50%;border:1px solid rgba(221,229,248,.28);
  background:rgba(0,0,0,.25);color:var(--mondstein);display:grid;place-items:center;cursor:pointer;padding:0}
.ikon-btn:active{transform:scale(.93)}

/* ---------- Stundenplan (Hub) ---------- */
.plan{max-width:640px;margin:0 auto}
.plan-kopf{text-align:center;margin:4px 0 14px}
.plan-kopf .gotisch{font-size:clamp(1.5rem,6vw,2.1rem);color:var(--mondstein);text-shadow:0 0 26px rgba(221,229,248,.35)}
.plan-kopf .hand{color:var(--haus2);font-size:1.15rem}

.ereignis{margin:0 auto 14px;max-width:640px}
.ereignis .hand{font-size:1.12rem;color:var(--rot)}

.faecher{display:grid;gap:12px;margin-top:6px}
.fach{position:relative;display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--pergament);color:var(--tinte-schrift);border:2px solid rgba(40,60,110,.22);
  border-left:6px solid var(--haus);border-radius:var(--r-m);padding:14px 14px;cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,.28);font-family:inherit;transition:transform .1s ease}
.fach::before{content:'';position:absolute;inset:0;border-radius:inherit;background-image:var(--papier);mix-blend-mode:multiply;pointer-events:none}
.fach:active{transform:translateY(2px) scale(.995)}
.fach .sym{width:44px;height:44px;flex:0 0 auto;color:var(--tinte-schrift)}
.fach .txt{flex:1;min-width:0}
.fach .tit{display:block;font-family:'Newsreader',serif;font-weight:700;font-size:1.16rem;line-height:1.15}
.fach .sub{display:block;font-family:'Caveat',cursive;font-weight:600;font-size:1.05rem;color:#6B5A3E;line-height:1.2;margin-top:1px}
.fach .marke{font-size:.7rem;font-weight:800;background:var(--haus);color:#111;border-radius:999px;padding:3px 8px;white-space:nowrap}
.fach.zu{opacity:.55;cursor:default}
.fach.neu{animation:pulsHaus 2.2s ease-in-out infinite}
@keyframes pulsHaus{0%,100%{box-shadow:0 8px 20px rgba(0,0,0,.28)}50%{box-shadow:0 8px 20px rgba(0,0,0,.28),0 0 0 4px rgba(201,162,39,.28)}}

.werkzeuge{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px;max-width:640px;margin-left:auto;margin-right:auto}
.wz{display:flex;align-items:center;gap:9px;background:rgba(31,27,61,.82);border:2px solid rgba(201,162,39,.42);
  border-radius:var(--r-m);padding:12px 11px;color:var(--mondstein);cursor:pointer;font-family:inherit;font-weight:700;
  font-size:.92rem;text-align:left;min-height:52px;line-height:1.2}
.wz:active{transform:translateY(2px)}
.wz .sym{width:26px;height:26px;flex:0 0 auto;color:var(--haus2)}
.wz .punkt{width:9px;height:9px;border-radius:50%;background:var(--rot);margin-left:auto;flex:0 0 auto;box-shadow:0 0 0 3px rgba(192,73,46,.28);animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

/* Tinte, die sich zeichnet */
.zeichnen path,.zeichnen line,.zeichnen circle,.zeichnen polyline{
  stroke-dasharray:var(--len,400);stroke-dashoffset:var(--len,400);
  animation:tinte 1.1s ease forwards}
@keyframes tinte{to{stroke-dashoffset:0}}

/* ---------- Panels / Overlays ---------- */
.deckel{position:absolute;inset:0;background:rgba(10,12,28,.78);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
.deckel.aktiv{display:flex}
.dialog{max-width:460px;width:100%;max-height:88%;overflow-y:auto;animation:auf .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes auf{from{transform:scale(.9) translateY(14px);opacity:0}to{transform:none;opacity:1}}

/* ---------- Karten / Raster ---------- */
.raster{display:grid;gap:10px}
.raster.z2{grid-template-columns:repeat(2,1fr)}
.raster.z3{grid-template-columns:repeat(3,1fr)}
.raster.z4{grid-template-columns:repeat(4,1fr)}

.karte{background:rgba(31,27,61,.86);border:2px solid rgba(201,162,39,.35);border-radius:var(--r-m);
  padding:11px;text-align:center;color:var(--mondstein);cursor:pointer;font-family:inherit;position:relative;overflow:hidden}
.karte:active{transform:translateY(2px)}
.karte .nm{font-weight:800;font-size:.82rem;line-height:1.2;margin-top:6px;
  overflow-wrap:break-word;hyphens:auto}
.karte .pr{font-size:.78rem;color:var(--messing-hell);font-weight:800;margin-top:4px}
.karte.hat{border-color:var(--gruen)}
.karte.an{border-color:var(--haus);box-shadow:0 0 0 3px rgba(201,162,39,.28)}
.karte.leer{opacity:.42;filter:grayscale(1)}
.karte.gold{border-color:var(--messing);box-shadow:0 0 0 2px rgba(232,212,138,.4),0 0 24px rgba(201,162,39,.35)}

.selten1{color:#B9C7D8}.selten2{color:#7FC2E8}.selten3{color:#C79BE8}.selten4{color:#E8D48A}

/* ---------- Trank-Labor ---------- */
#szene-trank .buehne{flex:1;display:flex;flex-direction:column;min-height:0}
.rezeptkarte{position:relative;background:var(--pergament);color:var(--tinte-schrift);border-radius:var(--r-s);
  border:2px solid var(--messing);padding:10px 12px 12px;margin:8px auto;max-width:520px;width:calc(100% - 8px);
  box-shadow:0 8px 22px rgba(0,0,0,.35)}
.rezeptkarte::before{content:'';position:absolute;inset:0;border-radius:inherit;background-image:var(--papier);mix-blend-mode:multiply;pointer-events:none}
.rezeptkarte h3{font-family:'Newsreader',serif;font-size:1.05rem;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.schritte{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.schritte li{display:flex;align-items:center;gap:8px;font-size:.9rem;padding:3px 5px;border-radius:6px;line-height:1.25}
.schritte li .nr{width:20px;height:20px;flex:0 0 auto;border-radius:50%;background:rgba(40,60,110,.16);
  display:grid;place-items:center;font-size:.7rem;font-weight:800}
.schritte li.jetzt{background:rgba(201,162,39,.26);box-shadow:inset 0 0 0 1px rgba(201,162,39,.5)}
.schritte li.fertig{opacity:.45;text-decoration:line-through}
.schritte li s{color:var(--rot);opacity:.8}
.korrektur{font-family:'Caveat',cursive;font-weight:700;color:var(--rot);font-size:1.05rem;margin-left:6px}
.merkhinweis{font-family:'Caveat',cursive;color:var(--rot);font-size:1.1rem;text-align:center;margin-top:4px}

.laborflaeche{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:0;padding-bottom:10px;position:relative}
#kesselWrap{position:relative;width:min(320px,76vw);max-height:100%;aspect-ratio:1/.92;display:grid;place-items:center;touch-action:none}
.rezeptkarte .chip{background:rgba(40,60,110,.14);border-color:rgba(40,60,110,.32);color:#5A6288}
#kesselCanvas{width:100%;height:100%;display:block}
.kesselhinweis{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-family:'Caveat',cursive;
  font-size:1.15rem;color:var(--messing-hell);white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.8);pointer-events:none}

.regal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:8px;background:rgba(31,27,61,.9);
  border-top:2px solid var(--messing);flex:0 0 auto}
.regal .zt{background:rgba(0,0,0,.3);border:2px solid rgba(201,162,39,.3);border-radius:10px;padding:5px 2px 4px;
  cursor:pointer;color:var(--mondstein);font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px}
.regal .zt:active{transform:translateY(2px)}
.regal .zt svg{width:26px;height:26px}
.regal .zt span{font-size:.56rem;font-weight:800;line-height:1;text-align:center;letter-spacing:-.2px}

.werkzeugleiste{display:flex;gap:7px;justify-content:center;padding:7px 8px;flex:0 0 auto;flex-wrap:wrap}
.flammenwahl{display:flex;gap:5px;background:rgba(0,0,0,.3);border:2px solid rgba(201,162,39,.3);border-radius:999px;padding:4px}
.flammenwahl button{width:38px;height:34px;border:0;border-radius:999px;background:transparent;color:var(--mondstein);cursor:pointer;display:grid;place-items:center}
.flammenwahl button.an{background:linear-gradient(180deg,#E8A33A,#D4553A);color:#20140A}

.praezision{width:min(340px,88vw);height:26px;border-radius:999px;background:rgba(0,0,0,.4);
  border:2px solid rgba(201,162,39,.4);position:relative;overflow:hidden;margin:6px auto 0}
.praezision .zone{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,rgba(78,138,76,.85),rgba(78,138,76,.55))}
.praezision .marker{position:absolute;top:-3px;bottom:-3px;width:5px;background:var(--mondstein);
  border-radius:3px;box-shadow:0 0 12px var(--mondstein)}
.rundenzaehler{font-family:'Caveat',cursive;font-size:1.2rem;color:var(--messing-hell);text-align:center}

.hud{display:flex;align-items:center;gap:10px;padding:7px 12px;flex:0 0 auto;background:rgba(19,26,51,.7)}
.zeitbalken{flex:1;height:10px;border-radius:999px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid rgba(201,162,39,.35)}
.zeitbalken i{display:block;height:100%;background:linear-gradient(90deg,var(--gruen),var(--messing));transition:width .1s linear}
.zeitbalken.eilig i{background:linear-gradient(90deg,#E8A33A,var(--rot))}

.puff{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:'Grenze Gotisch',serif;
  font-size:2.4rem;color:#DDD;pointer-events:none;animation:puff .9s ease forwards;text-shadow:0 4px 20px #000}
@keyframes puff{0%{opacity:0;transform:translate(-50%,-40%) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-95%) scale(1.5)}}

.flieg{position:absolute;font-weight:900;font-size:1.1rem;color:var(--messing-hell);pointer-events:none;
  text-shadow:0 2px 8px #000;animation:flieg 1s ease-out forwards;z-index:30}
@keyframes flieg{0%{opacity:0;transform:translateY(0) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translateY(-58px) scale(1.1)}}

/* ---------- Besenflug ---------- */
#szene-flug{background:#0B1024}
#flugCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.flug-hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:9px 60px 9px 12px;
  pointer-events:none;z-index:5;text-shadow:0 2px 8px #000}
.flug-hud .pkt{font-weight:900;font-size:1.25rem;color:var(--messing-hell)}
.flug-hud .best{font-size:.78rem;color:var(--mondstein);opacity:.85}
.leben{display:flex;gap:5px;margin-left:auto}
.leben i{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--haus));
  box-shadow:0 0 10px var(--haus)}
.leben i.weg{background:rgba(255,255,255,.16);box-shadow:none}
.flug-pause{position:absolute;top:8px;right:8px;z-index:6;pointer-events:auto}
.powerhinweis{position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:5;font-weight:900;
  font-family:'Caveat',cursive;font-size:1.5rem;color:var(--mondstein);text-shadow:0 2px 12px #000;pointer-events:none}

/* ---------- Sanduhren (Hauspokal) ---------- */
.uhren{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:8px}
.uhr{text-align:center}
.uhr .glas{position:relative;height:120px;width:100%;max-width:66px;margin:0 auto;
  border:2px solid var(--messing);border-radius:8px;background:rgba(0,0,0,.32);overflow:hidden}
.uhr .fuell{position:absolute;left:0;right:0;bottom:0;transition:height .9s cubic-bezier(.3,.9,.4,1)}
.uhr .glas::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.10),transparent 40%,rgba(0,0,0,.22))}
.uhr .nm{font-size:.72rem;font-weight:800;margin-top:5px;line-height:1.1}
.uhr .pk{font-size:.82rem;font-weight:900;color:var(--messing-hell)}
.uhr.mein .glas{box-shadow:0 0 0 3px rgba(232,212,138,.45)}

/* ---------- Album ---------- */
.reiter{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.reiter button{font-family:inherit;font-weight:800;font-size:.85rem;padding:8px 14px;border-radius:999px;
  border:2px solid rgba(201,162,39,.4);background:rgba(0,0,0,.28);color:var(--mondstein);cursor:pointer}
.reiter button.an{background:var(--haus);color:#12162C;border-color:transparent}

.silhouette{filter:brightness(0) saturate(0) opacity(.35)}

/* ---------- Kammer ---------- */
.kammer{position:relative;height:270px;border-radius:var(--r-m);overflow:hidden;border:2px solid var(--messing);
  background:linear-gradient(180deg,#241F47,#161A34)}
.kammer .boden{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,#3A2E20,#241C14)}
.kammer .fenster{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:96px;height:112px;
  border-radius:48px 48px 8px 8px;background:radial-gradient(circle at 50% 30%,#4E5B96,#1B2145);
  border:3px solid var(--messing);box-shadow:0 0 34px rgba(221,229,248,.28) inset}

/* ---------- Verteilung ---------- */
.stein{width:120px;height:120px;border-radius:50%;margin:0 auto 18px;
  background:radial-gradient(circle at 34% 30%,#fff,#DDE5F8 40%,#8C97C9 100%);
  box-shadow:0 0 60px rgba(221,229,248,.6);animation:schwebe 3s ease-in-out infinite;transition:background .6s ease,box-shadow .6s}
@keyframes schwebe{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.stein.knall{animation:knall .7s ease forwards}
@keyframes knall{0%{transform:scale(1)}45%{transform:scale(1.35);filter:brightness(2.2)}100%{transform:scale(0);opacity:0}}

.wahlliste{display:flex;flex-direction:column;gap:9px;width:100%;max-width:460px;margin:14px auto 0}
.wahl{background:var(--pergament);color:var(--tinte-schrift);border:2px solid rgba(40,60,110,.24);
  border-radius:var(--r-m);padding:14px 15px;font-family:inherit;font-weight:700;font-size:.98rem;
  cursor:pointer;text-align:left;position:relative;line-height:1.3;min-height:52px}
.wahl::before{content:'';position:absolute;inset:0;border-radius:inherit;background-image:var(--papier);mix-blend-mode:multiply;pointer-events:none}
.wahl:active{transform:translateY(2px)}
.wahl.gewaehlt{border-color:var(--haus);box-shadow:0 0 0 3px rgba(201,162,39,.35)}
.wahl.richtig{border-color:var(--gruen);box-shadow:0 0 0 3px rgba(78,138,76,.35)}
.wahl.falsch{border-color:var(--rot);box-shadow:0 0 0 3px rgba(192,73,46,.3)}

.fortschritt{display:flex;gap:5px;justify-content:center;margin-bottom:12px}
.fortschritt i{width:26px;height:5px;border-radius:3px;background:rgba(221,229,248,.22)}
.fortschritt i.an{background:var(--haus)}

/* ---------- Ankunft ---------- */
#szene-ankunft .himmel{position:absolute;inset:0;background:
  radial-gradient(700px 420px at 50% 10%, rgba(221,229,248,.16), transparent 60%),
  linear-gradient(180deg,#0D1330 0%, #1A1C3E 55%, #0A0D22 100%)}
.sternchen{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:funkeln 3s infinite}
@keyframes funkeln{0%,100%{opacity:.25}50%{opacity:1}}
.kutsche{position:absolute;bottom:16%;left:-30%;width:120px;animation:fahrt 3.4s cubic-bezier(.35,0,.25,1) forwards}
@keyframes fahrt{to{left:calc(50% - 60px)}}
.schloss{position:absolute;bottom:26%;left:50%;transform:translateX(-50%);width:min(560px,86vw);opacity:0;animation:einblenden 1.6s .5s ease forwards}
@keyframes einblenden{to{opacity:1}}
.ankunft-text{position:absolute;bottom:8%;left:0;right:0;text-align:center;padding:0 20px;opacity:0;animation:einblenden 1s 2.6s ease forwards}

/* ---------- Diverses ---------- */
.trenner{height:1px;background:rgba(201,162,39,.3);margin:14px 0}
.abschnitt{max-width:640px;margin:0 auto 16px}
.titelzeile{display:flex;align-items:center;gap:10px;margin:2px 0 12px;max-width:640px;margin-left:auto;margin-right:auto}
.titelzeile h2{flex:1;font-family:'Newsreader',serif;font-size:1.32rem;margin:0;color:var(--mondstein)}
.chip{display:inline-block;background:rgba(201,162,39,.2);border:1px solid rgba(201,162,39,.45);
  border-radius:999px;padding:3px 10px;font-size:.72rem;font-weight:800;color:var(--messing-hell)}
/* Auf Pergament braucht der Chip dunkle Schrift */
.blatt .chip{background:rgba(201,162,39,.26);border-color:#B08D1C;color:#6E5510}
.streifen{font-family:'Caveat',cursive;font-size:1.16rem;color:var(--haus2);text-align:center;margin:6px 0}
.gross{font-size:clamp(1.7rem,7vw,2.6rem)}
.mini{width:22px;height:22px;vertical-align:-5px}
.reihe{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.balken{height:9px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden;border:1px solid rgba(201,162,39,.3)}
.balken i{display:block;height:100%;background:linear-gradient(90deg,var(--haus),var(--haus2));transition:width .5s ease}

input[type=text]{font-family:'Nunito',sans-serif;font-weight:800;font-size:1.15rem;text-align:center;
  padding:13px 16px;border-radius:var(--r-m);border:2px solid var(--messing);background:var(--pergament);
  color:var(--tinte-schrift);width:min(300px,84vw);-webkit-user-select:text;user-select:text}

.leiste{display:flex;gap:9px;justify-content:center;padding:10px 12px;flex:0 0 auto;background:rgba(19,26,51,.85);border-top:1px solid rgba(201,162,39,.25)}

.abz{display:flex;gap:11px;align-items:center;background:rgba(31,27,61,.8);border:2px solid rgba(201,162,39,.3);
  border-radius:var(--r-m);padding:11px;margin-bottom:9px}
.abz .med{width:44px;height:44px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  background:rgba(0,0,0,.3);border:2px solid rgba(201,162,39,.4);color:var(--tinte-blass)}
.abz.hat .med{background:linear-gradient(180deg,var(--messing-hell),var(--messing));color:#20140A;border-color:#8E7318;
  box-shadow:0 0 18px rgba(201,162,39,.5)}
.abz .nm{font-weight:800;font-size:.95rem}
.abz .bs{font-size:.8rem;color:var(--tinte-blass);line-height:1.25}

.eule-anim{animation:klopf 1.4s ease-in-out infinite}
@keyframes klopf{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}

.gross-moment{animation:gross-rein .8s cubic-bezier(.2,.9,.3,1.3)}
@keyframes gross-rein{from{transform:scale(.7);opacity:0;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}

.wappenrahmen{width:132px;height:132px;margin:0 auto 10px;filter:drop-shadow(0 0 26px var(--haus))}

/* ---------- Reduzierte Bewegung ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  #kerzen{display:none}
  .kutsche{left:calc(50% - 60px);animation:none}
  .schloss,.ankunft-text{opacity:1;animation:none}
}

/* ---------- Größere Schirme ---------- */
@media (min-width:720px){
  .rollen{padding:20px 24px 34px}
  .werkzeuge{grid-template-columns:repeat(4,1fr)}
  .regal{grid-template-columns:repeat(12,1fr)}
  .regal .zt span{font-size:.62rem}
  #kesselWrap{width:min(340px,46vh)}
  .kutsche{width:170px}
}
@media (max-height:560px){
  #kesselWrap{width:min(190px,44vw)}
  .rezeptkarte{padding:7px 10px 9px}
  .schritte li{font-size:.82rem}
}

/* ---------- SPEICHER (window.storage → localStorage) ---------- */
const SCHLUESSEL = 'mondstein_akademie_v1';
const Speicher = {
  extern:null,
  _pruefe(){
    if(this.extern !== null) return this.extern;
    try{
      const s = window.storage;
      if(s && (typeof s.get==='function' || typeof s.getItem==='function')) this.extern = s;
      else this.extern = false;
    }catch(e){ this.extern = false; }
    return this.extern;
  },
  async laden(){
    const s = this._pruefe();
    if(s){
      try{
        let roh = typeof s.get==='function' ? await s.get(SCHLUESSEL) : await s.getItem(SCHLUESSEL);
        if(roh && typeof roh==='object' && 'value' in roh) roh = roh.value;
        if(typeof roh === 'string') return JSON.parse(roh);
        if(roh) return roh;
      }catch(e){ /* still auf localStorage zurückfallen */ }
    }
    try{
      const roh = localStorage.getItem(SCHLUESSEL);
      return roh ? JSON.parse(roh) : null;
    }catch(e){ return null; }
  },
  async sichern(daten){
    const s = this._pruefe();
    if(s){
      try{
        if(typeof s.set==='function') await s.set(SCHLUESSEL, JSON.stringify(daten));
        else await s.setItem(SCHLUESSEL, JSON.stringify(daten));
      }catch(e){ /* egal, localStorage folgt */ }
    }
    try{ localStorage.setItem(SCHLUESSEL, JSON.stringify(daten)); }catch(e){}
  }
};

/* ---------- TON (Web Audio, keine Dateien) ---------- */
const Ton = {
  ctx:null,
  start(){
    if(this.ctx) { if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.ctx = null; }
  },
  note(freq, dauer, typ, vol, verzoegerung){
    if(!S.ton || !this.ctx) return;
    const t0 = this.ctx.currentTime + (verzoegerung||0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = typ||'sine'; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol||.12, t0+.012);
    g.gain.exponentialRampToValueAtTime(.0001, t0+(dauer||.18));
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t0); o.stop(t0+(dauer||.18)+.03);
  },
  rausch(dauer, vol){
    if(!S.ton || !this.ctx) return;
    const n = Math.floor(this.ctx.sampleRate*dauer);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1-i/n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const g = this.ctx.createGain(); g.gain.value = vol||.1;
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
    src.connect(f); f.connect(g); g.connect(this.ctx.destination); src.start();
  },
  klick(){ this.note(520,.07,'triangle',.09); },
  auf(){ this.note(660,.09,'triangle',.1); this.note(880,.12,'triangle',.08,.06); },
  gut(){ [523,659,784].forEach((f,i)=>this.note(f,.16,'sine',.11,i*.07)); },
  toll(){ [523,659,784,1046].forEach((f,i)=>this.note(f,.24,'sine',.12,i*.09)); },
  schlecht(){ this.note(200,.22,'sawtooth',.07); this.rausch(.3,.07); },
  muenze(){ this.note(1180,.07,'square',.06); this.note(1560,.1,'square',.05,.05); },
  blubb(){ this.note(140+Math.random()*90,.13,'sine',.07); },
  zisch(){ this.rausch(.5,.09); },
  stufe(){ [392,523,659,784,1046].forEach((f,i)=>this.note(f,.3,'triangle',.11,i*.1)); }
};

function fortschrittZahl(){
  return Object.keys(S.traenke).length + Object.keys(S.wesen).length + S.stats.fluege + (S.kapitel*2);

/* Belohnungen */
function gibSteine(n, still){
  S.steine += n; S.gesamt += n;
  if(!still){ Ton.muenze(); fliegMitte('+'+n+' Mondsteine'); }
  pruefeAbzeichen(); kopfAktualisieren(); sichern();
}
function gibHauspunkte(n){
  if(!S.haus) return;
  if(S.ereignis && S.ereignis.effekt.punkteX2) n = n*2;
  S.hauspunkte[S.haus] += n;
  S.stats.hauspunkteEigen += n;
  pruefeAbzeichen(); kopfAktualisieren(); sichern();
  return n;
}
function gibZutat(id, n){
  n = n||1;
  S.zutaten[id] = (S.zutaten[id]||0) + n;
  sichern();
}
function gibWesen(id){
  const neu = !S.wesen[id];
  S.wesen[id] = (S.wesen[id]||0) + 1;
  pruefeAbzeichen(); sichern();
  return neu;
}

/* ---------- ABZEICHEN ---------- */
function pruefeAbzeichen(){
  const p = {
    erster_trank: S.stats.gebraut >= 1,
    nie_explodiert: S.stats.ohneFehler >= 5,
    meisterbrauer: Object.keys(S.traenke).length >= 24,
    goldener_kessel: S.stats.meisterwerke >= 5,
    erster_flug: S.stats.fluege >= 1,
    sternenjaeger: (S.stats.maxKugeln||0) >= 100,
    hoehenflug: S.flugBest >= 1500,
    besenmeister: S.besitz.besen.length >= 4,
    runenkenner: S.stats.quizPerfekt >= 1,
    sammler: Object.keys(S.wesen).length >= 10,
    alle_wesen: Object.keys(S.wesen).length >= 18,
    tierfreund: S.besitz.begleiter.length >= 1,
    sieben_tage: S.serie >= 7,
    hausheld: S.stats.hauspunkteEigen >= 500,
    reich: S.gesamt >= 1000,
    geschichte: S.kapitel >= 8
  };
  let neue = [];
  for(const a of ABZEICHEN){
    if(p[a.id] && !S.abzeichen[a.id]){ S.abzeichen[a.id] = 1; neue.push(a); }
  }
  if(neue.length){ sichern(); neue.forEach(a => abzeichenMelden(a)); }
}

/* Abzeichen warten höflich, bis kein anderes Fenster offen ist */
let abzListe = [], abzTakt = null;
function abzeichenMelden(a){
  abzListe.push(a);
  if(abzTakt) return;
  abzTakt = setInterval(()=>{
    if(!abzListe.length){ clearInterval(abzTakt); abzTakt = null; return; }
    if(document.querySelector('.deckel')) return;
    abzeichenZeigen(abzListe.shift());
  }, 350);
}
function abzeichenZeigen(a){
  Ton.toll();
  const d = el('div','deckel aktiv');
  d.innerHTML = '<div class="dialog blatt zentriert gross-moment" style="max-width:340px">'+
    '<div style="width:78px;height:78px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;'+
    'background:linear-gradient(180deg,#E8D48A,#C9A227);color:#20140A;border:3px solid #8E7318;box-shadow:0 0 26px rgba(201,162,39,.6)">'+ico(a.icon,42)+'</div>'+
    '<div class="hand" style="font-size:1.3rem;color:#8E7318">Abzeichen erhalten!</div>'+
    '<h2 class="serif" style="margin:2px 0 4px;color:#20264A">'+esc(a.name)+'</h2>'+
    '<p style="margin:0 0 14px;font-size:.9rem;color:#5A6288">'+esc(a.text)+'</p>'+
    '<button class="btn" data-zu>Weiter</button></div>';
  document.body.appendChild(d);
  d.querySelector('[data-zu]').onclick = ()=>{ Ton.klick(); d.remove(); };
  d.onclick = e => { if(e.target===d) d.remove(); };
}

/* ---------- KOPFLEISTE ---------- */
function kopfAktualisieren(){
  document.querySelectorAll('[data-kopf]').forEach(k => {
    const h = HAEUSER[S.haus];
    k.innerHTML =
      (k.dataset.zurueck ? '<button class="ikon-btn" data-zurueck aria-label="Zurück zum Stundenplan">'+ico('zurueck',22)+'</button>' :
        '<div class="wappen">'+(h?wappen(S.haus,34):'')+'</div>') +

      '<button class="ikon-btn" data-ton aria-label="Ton an oder aus">'+ico(S.ton?'ton':'tonAus',20)+'</button>';
  });
  document.querySelectorAll('[data-zurueck]').forEach(b => b.onclick = ()=>{ Ton.klick(); hubZeigen(); });
  document.querySelectorAll('[data-ton]').forEach(b => b.onclick = ()=>{
    S.ton = !S.ton; if(S.ton){ Ton.start(); Ton.auf(); } sichern(); kopfAktualisieren();
  });
}

/* ---------- HAUSFARBE ---------- */
function hausfarbeSetzen(){
  const h = HAEUSER[S.haus];
  if(!h) return;
  document.documentElement.style.setProperty('--haus', h.farbe);
  document.documentElement.style.setProperty('--haus2', h.farbe2);
  const meta = document.querySelector('meta[name=theme-color]');
  if(meta) meta.setAttribute('content', '#131A33');
}

/* ---------- DIALOG ---------- */
function dialog(inhalt, opt){
  opt = opt || {};
  const d = el('div','deckel aktiv');
  d.innerHTML = '<div class="dialog blatt '+(opt.klasse||'')+'">'+inhalt+'</div>';
  document.body.appendChild(d);
  const schliessen = ()=>{ d.remove(); if(opt.beimSchliessen) opt.beimSchliessen(); };
  d.querySelectorAll('[data-zu]').forEach(b => b.onclick = ()=>{ Ton.klick(); schliessen(); });
  if(opt.klickAussen !== false) d.onclick = e => { if(e.target===d) schliessen(); };
  return { el:d, schliessen:schliessen };
}

function verteilungAnimation(){
  let best = HAUS_IDS[0];
  HAUS_IDS.forEach(h => { if(hausPunkte[h] > hausPunkte[best]) best = h; });
  const gleich = HAUS_IDS.filter(h => hausPunkte[h] === hausPunkte[best]);
  const haus = gleich.length > 1 ? zufall(gleich) : best;

  const s = $('#szene-verteilung');
  s.innerHTML = '<div class="mitte">'+
    '<div class="stein" id="vStein"></div>'+
    '<div class="gotisch" style="font-size:1.6rem;color:var(--mondstein)">Die Verteilung</div>'+
    '<div class="hand" style="font-size:1.25rem;color:var(--messing-hell)">Der Mondstein entscheidet …</div></div>';
  const st = $('#vStein');
  let n = 0;
  const wirbel = setInterval(()=>{
    const h = HAUS_IDS[n % 4];
    st.style.background = 'radial-gradient(circle at 34% 30%, #fff, '+HAEUSER[h].farbe+' 55%, '+HAEUSER[h].farbe+' 100%)';
    st.style.boxShadow = '0 0 60px '+HAEUSER[h].farbe;
    Ton.note(300+((n%4)*90),.06,'triangle',.06);
    n++;
  }, 130);
  setTimeout(()=>{
    clearInterval(wirbel);
    st.style.background = 'radial-gradient(circle at 34% 30%, #fff, '+HAEUSER[haus].farbe+' 55%, '+HAEUSER[haus].farbe+' 100%)';
    st.style.boxShadow = '0 0 90px '+HAEUSER[haus].farbe;
    setTimeout(()=>{
      st.classList.add('knall'); Ton.zisch(); Ton.stufe();
      teilchenExplosion(HAEUSER[haus].farbe);
      setTimeout(()=>hausErgebnis(haus), 800);
    }, 600);
  }, 2400);
}
function teilchenExplosion(farbe){
  const wrap = el('div','');
  wrap.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:60';
  document.body.appendChild(wrap);
  const cx = window.innerWidth/2, cy = window.innerHeight*0.34;
  for(let i=0;i<46;i++){
    const p = el('i','');
    const w = Math.random()*Math.PI*2, v = 90 + Math.random()*260;
    p.style.cssText = 'position:absolute;left:'+cx+'px;top:'+cy+'px;width:7px;height:7px;border-radius:50%;'+
      'background:'+(Math.random()<.4?'#DDE5F8':farbe)+';box-shadow:0 0 12px '+farbe+';transition:transform 1.1s cubic-bezier(.15,.7,.3,1),opacity 1.1s';
    wrap.appendChild(p);
    requestAnimationFrame(()=>{
      p.style.transform = 'translate('+Math.cos(w)*v+'px,'+(Math.sin(w)*v+120)+'px) scale(.2)';
      p.style.opacity = '0';
    });
  }
  setTimeout(()=>wrap.remove(), 1400);
}
function hausErgebnis(hausId){
  S.haus = hausId;
  hausfarbeSetzen(); sichern();
  const h = HAEUSER[hausId];

    zeige('trank');
    trankStarten(1, true);
  };
}
