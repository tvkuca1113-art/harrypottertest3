const T = {
  aktiv:false, tutorial:false, rezept:null, stufe:1,
  schritt:0, qualitaet:3, fehler:0, flamme:1,
  zeit:0, zeitMax:0, blubber:[], farbe:'#5B8C5A', zielFarbe:'#5B8C5A',
  ruehrWinkel:0, ruehrSumme:0, ruehrRunden:0, ruehrPhase:0, /* 0 = rühren, 1 = loslassen */
  haelt:false, letzterWinkel:null, marker:0, markerRichtung:1,
  warten:false, wartenBis:0, kartenSichtbar:true, gespickt:false,
  ctx:null, canvas:null, raf:null, letzteZeit:0, wackeln:0, glanz:0, tasteRichtung:0
};

function trankZeitFuer(stufe){
  let z;
  if(stufe <= 6) z = 999;
  else if(stufe <= 14) z = 80;
  else z = 62;
  if(S.jahr2 && z < 900) z = Math.round(z*0.82);
  return z;
}
function gruenZone(stufe){
  if(stufe <= 6) return .30;
  if(stufe <= 14) return .22;
  return .15;
}

function trankStarten(stufe, tutorial){
  T.aktiv = true; T.tutorial = !!tutorial;
  T.stufe = klemm(stufe, 1, 24);
  T.rezept = TRAENKE[T.stufe-1];
  T.schritt = 0; T.qualitaet = 3; T.fehler = 0; T.flamme = 1;
  T.zeitMax = T.tutorial ? 999 : trankZeitFuer(T.stufe);
  T.zeit = T.zeitMax;
  T.blubber = []; T.farbe = '#4A5A78'; T.zielFarbe = '#4A5A78';
  T.ruehrSumme = 0; T.ruehrRunden = 0; T.ruehrPhase = 0; T.haelt = false; T.letzterWinkel = null;
  T.marker = 0; T.markerRichtung = 1; T.warten = false; T.gespickt = false; T.wackeln = 0; T.glanz = 0;
  T.kartenSichtbar = true;
  trankAufbauen();
  if(!T.tutorial && T.stufe >= 15){
    setTimeout(()=>{ if(T.aktiv && T.stufe>=15){ T.kartenSichtbar = false; trankKarteZeichnen(); } }, 5000);
  }
  T.letzteZeit = performance.now();
  cancelAnimationFrame(T.raf);
  T.raf = requestAnimationFrame(trankSchleife);
}

beimVerlassen['trank'] = ()=>{
  T.aktiv = false; cancelAnimationFrame(T.raf);
  document.removeEventListener('keydown', trankTaste);
  document.removeEventListener('keyup', trankTasteAuf);
  window.removeEventListener('resize', kesselGroesse);
};

function trankAufbauen(){
  const s = $('#szene-trank');
  s.innerHTML =
    '<div class="kopf" data-kopf data-zurueck="1"></div>'+
    '<div class="hud">'+
      '<span class="chip" id="tStufe">Stunde '+T.stufe+'</span>'+
      '<div class="zeitbalken" id="tZeit"><i style="width:100%"></i></div>'+
      '<button class="ikon-btn" id="tPause" aria-label="Pause">'+ico('pause',20)+'</button>'+
    '</div>'+
    '<div class="buehne">'+
      '<div id="tKarte"></div>'+
      '<div class="laborflaeche">'+
        '<div class="praezision" id="tPraez" style="display:none">'+
          '<div class="zone" id="tZone"></div><div class="marker" id="tMarker"></div></div>'+
        '<div class="rundenzaehler" id="tRunden"></div>'+
        '<div id="kesselWrap"><canvas id="kesselCanvas"></canvas>'+
          '<div class="kesselhinweis" id="tHinweis"></div></div>'+
      '</div>'+
    '</div>'+
    '<div class="werkzeugleiste">'+
      '<div class="flammenwahl" role="group" aria-label="Flamme einstellen">'+
        [1,2,3].map(n=>'<button data-fl="'+n+'" aria-label="Flamme Stufe '+n+'" class="'+(n===1?'an':'')+'">'+
          '<svg width="'+(12+n*5)+'" height="'+(12+n*5)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="'+PFADE.flamme+'"/></svg></button>').join('')+
      '</div>'+
      '<button class="btn klein" id="tWarten" style="display:none">Warten</button>'+
      '<button class="btn klein geist" id="tSpicken" style="display:none">Spicken</button>'+
    '</div>'+
    '<div class="regal" id="tRegal" role="group" aria-label="Zutatenregal">'+
      ZUTATEN.map(z=>'<button class="zt" data-z="'+z.id+'" aria-label="'+esc(z.name)+' hinzufügen">'+
        '<span style="color:'+z.farbe+'">'+ico(z.icon,26)+'</span><span>'+esc(nm(z.name))+'</span></button>').join('')+
    '</div>';

  kopfAktualisieren();
  T.canvas = $('#kesselCanvas'); T.ctx = T.canvas.getContext('2d');
  kesselGroesse();
  window.addEventListener('resize', kesselGroesse);

  document.removeEventListener('keydown', trankTaste);
  document.removeEventListener('keyup', trankTasteAuf);
  document.addEventListener('keydown', trankTaste);
  document.addEventListener('keyup', trankTasteAuf);
  s.querySelectorAll('[data-z]').forEach(b => b.onclick = ()=>zutatGewaehlt(b.dataset.z, b));
  s.querySelectorAll('[data-fl]').forEach(b => b.onclick = ()=>flammeGewaehlt(+b.dataset.fl));
  $('#tWarten').onclick = wartenStarten;
  $('#tSpicken').onclick = spicken;
  $('#tPause').onclick = trankPause;

  const w = $('#kesselWrap');
  w.addEventListener('pointerdown', ruehrStart);
  w.addEventListener('pointermove', ruehrBewegung);
  w.addEventListener('pointerup', ruehrEnde);
  w.addEventListener('pointercancel', ruehrEnde);

  trankKarteZeichnen(); trankSchrittAnzeigen();
}

function kesselGroesse(){
  if(!T.canvas) return;
  const r = T.canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  T.canvas.width = Math.max(1, Math.round(r.width*dpr));
  T.canvas.height = Math.max(1, Math.round(r.height*dpr));
  T.ctx.setTransform(dpr,0,0,dpr,0,0);
  T.bw = r.width; T.bh = r.height;
}

/* ---------- Rezeptkarte ---------- */
function schrittText(sch, idx){
  if(sch.t==='zutat'){
    const z = ZUTAT[sch.z];
    const k = T.rezept.korrektur;
    if(k && k.schritt === idx){
      return '<s>'+esc(ZUTAT[k.falsch].name)+'</s> <span class="korrektur">→ '+esc(z.name)+'!</span>';
    }
    return '<b>'+esc(z.name)+'</b> hinzufügen';
  }
  if(sch.t==='ruehren') return sch.runden+'× '+(sch.dir===1?'im Uhrzeigersinn':'gegen den Uhrzeigersinn')+' rühren';
  if(sch.t==='flamme') return 'Flamme auf <b>'+['niedrig','mittel','hoch'][sch.s-1]+'</b>';
  if(sch.t==='warten') return sch.s+' Sekunden warten';
  return '';
}
function trankKarteZeichnen(){
  const k = $('#tKarte'); if(!k) return;
  if(!T.kartenSichtbar){
    k.innerHTML = '<div class="rezeptkarte zentriert"><div class="hand" style="font-size:1.2rem;color:#C0492E">'+
      'Das Rezept ist weg. Du kannst es!</div></div>';
    const sp = $('#tSpicken'); if(sp && !T.gespickt) sp.style.display='inline-flex';
    return;
  }
  const r = T.rezept;
  k.innerHTML = '<div class="rezeptkarte">'+
    '<h3><span>'+esc(r.name)+'</span><span class="chip">Stunde '+T.stufe+'</span></h3>'+
    '<ul class="schritte">'+ r.schritte.map((sch,i)=>
      '<li class="'+(i<T.schritt?'fertig':(i===T.schritt?'jetzt':''))+'"><span class="nr">'+(i+1)+'</span>'+
      '<span>'+schrittText(sch,i)+'</span></li>').join('') +'</ul>'+
    (r.korrektur ? '<div class="merkhinweis">Achtung: eine Zutat ist durchgestrichen. Nimm die richtige!</div>' : '')+
    (T.stufe>=15 && T.kartenSichtbar && !T.tutorial ? '<div class="merkhinweis">Merk es dir — die Karte verschwindet gleich!</div>' : '')+
    '</div>';
}
function spicken(){
  if(T.gespickt) return;
  T.gespickt = true; Ton.klick();
  $('#tSpicken').style.display = 'none';
  T.kartenSichtbar = true; trankKarteZeichnen();
  T.qualitaet = Math.max(1, T.qualitaet - 0.5);
  setTimeout(()=>{ if(T.aktiv){ T.kartenSichtbar = false; trankKarteZeichnen(); } }, 2400);
}

/* ---------- Schrittführung ---------- */
function aktuellerSchritt(){ return T.rezept.schritte[T.schritt]; }
function trankSchrittAnzeigen(){
  if(!T.aktiv) return;
  const sch = aktuellerSchritt();
  const h = $('#tHinweis'), pr = $('#tPraez'), rz = $('#tRunden'), wb = $('#tWarten');
  document.querySelectorAll('#tRegal .zt').forEach(b => b.style.boxShadow = '');
  document.querySelectorAll('[data-fl]').forEach(b => b.style.boxShadow = '');
  pr.style.display = 'none'; rz.textContent = ''; wb.style.display = 'none';
  T.ruehrSumme = 0; T.ruehrRunden = 0; T.ruehrPhase = 0; T.haelt = false; T.letzterWinkel = null;

  if(!sch){ h.textContent = ''; return; }
  if(sch.t==='zutat'){
    h.textContent = T.kartenSichtbar || T.tutorial ? ZUTAT[sch.z].name+' aus dem Regal' : 'Welche Zutat kommt jetzt?';
    if(T.tutorial){
      const b = document.querySelector('#tRegal [data-z="'+sch.z+'"]');
      if(b) b.style.boxShadow = '0 0 0 3px var(--messing), 0 0 20px var(--messing)';
    }
  } else if(sch.t==='ruehren'){
    h.textContent = (sch.dir===1?'Im Uhrzeigersinn':'Gegen den Uhrzeigersinn')+' rühren';
    rz.textContent = '0 / '+sch.runden+' Runden';
    pr.style.display = 'none';
  } else if(sch.t==='flamme'){
    h.textContent = 'Flamme auf '+['niedrig','mittel','hoch'][sch.s-1];
    if(T.tutorial){
      const b = document.querySelector('[data-fl="'+sch.s+'"]');
      if(b) b.style.boxShadow = '0 0 0 3px var(--messing), 0 0 20px var(--messing)';
    }
  } else if(sch.t==='warten'){
    h.textContent = sch.s+' Sekunden warten';
    wb.style.display = 'inline-flex';
  }
  trankKarteZeichnen();
}

function schrittGeschafft(bonus){
  T.schritt++;
  T.glanz = 1;
  Ton.gut();
  if(bonus) fliegMitte('Perfekt!', '#8FE08A');
  const r = T.rezept;
  T.zielFarbe = mischFarbe('#4A5A78', r.farbe, T.schritt / r.schritte.length);
  if(T.schritt >= r.schritte.length){ trankFertig(); return; }
  trankSchrittAnzeigen();
}
function fehlerMachen(text){
  if(T.tutorial){ hinweisBlase(text); Ton.klick(); return; }
  T.fehler++; T.qualitaet = Math.max(1, T.qualitaet - 1);
  T.wackeln = 1; Ton.schlecht(); rauchPuff();
  hinweisBlase(text);
}
function hinweisBlase(text){
  const h = $('#tHinweis'); if(!h) return;
  const alt = h.textContent;
  h.textContent = text; h.style.color = 'var(--rot,#E08A7A)';
  setTimeout(()=>{ if($('#tHinweis')===h){ h.style.color=''; trankSchrittAnzeigen(); } }, 1900);
}
function rauchPuff(){
  const w = $('#kesselWrap'); if(!w) return;
  const p = el('div','puff','Puff!');
  w.appendChild(p); setTimeout(()=>p.remove(), 950);
}

/* ---------- Aktionen ---------- */
function zutatGewaehlt(id){
  if(!T.aktiv) return;
  const sch = aktuellerSchritt(); if(!sch) return;
  if(T.warten){ fehlerMachen('Nicht anfassen — der Trank ruht!'); return; }
  if(sch.t !== 'zutat'){ fehlerMachen('Erst der Schritt davor.'); return; }
  Ton.blubb();
  if(id === sch.z){ farbSpritzer(ZUTAT[id].farbe); schrittGeschafft(false); }
  else {
    const k = T.rezept.korrektur;
    if(k && k.schritt === T.schritt && id === k.falsch) fehlerMachen('Die ist durchgestrichen! Lies die Notiz.');
    else fehlerMachen('Das war die falsche Zutat.');
  }
}
function flammeGewaehlt(n){
  if(!T.aktiv) return;
  T.flamme = n;
  document.querySelectorAll('[data-fl]').forEach(b => b.classList.toggle('an', +b.dataset.fl === n));
  Ton.note(180+n*70,.12,'sawtooth',.06);
  const sch = aktuellerSchritt(); if(!sch) return;
  if(T.warten){ fehlerMachen('Nicht anfassen — der Trank ruht!'); return; }
  if(sch.t !== 'flamme') return;
  if(n === sch.s) schrittGeschafft(false);
  else if(n > sch.s) fehlerMachen('Der Kessel ist zu heiß. Dreh die Flamme runter.');
  else fehlerMachen('Zu wenig Feuer. Dreh die Flamme höher.');
}
function wartenStarten(){
  const sch = aktuellerSchritt();
  if(!T.aktiv || !sch || sch.t !== 'warten') return;
  T.warten = true; T.wartenBis = performance.now() + sch.s*1000;
  $('#tWarten').disabled = true;
  $('#tHinweis').textContent = 'Ruhig … nicht anfassen!';
  Ton.note(300,.5,'sine',.05);
}

/* Rühren */
function winkelVon(e, w){
  const r = w.getBoundingClientRect();
  return Math.atan2(e.clientY - (r.top+r.height/2), e.clientX - (r.left+r.width/2));
}
function ruehrStart(e){
  const sch = aktuellerSchritt();
  if(!T.aktiv || !sch) return;
  if(sch.t !== 'ruehren'){
    if(T.warten) fehlerMachen('Nicht anfassen — der Trank ruht!');
    return;
  }
  e.preventDefault();
  T.haelt = true;
  T.letzterWinkel = winkelVon(e, e.currentTarget);
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(err){}
}
function ruehrBewegung(e){
  if(!T.haelt || T.ruehrPhase !== 0) return;
  const sch = aktuellerSchritt(); if(!sch || sch.t !== 'ruehren') return;
  const w = winkelVon(e, e.currentTarget);
  let d = w - T.letzterWinkel;
  while(d > Math.PI) d -= Math.PI*2;
  while(d < -Math.PI) d += Math.PI*2;
  T.letzterWinkel = w;
  ruehrFortschritt(d * sch.dir);
}
function ruehrFortschritt(fortschritt){
  const sch = aktuellerSchritt(); if(!sch || sch.t!=='ruehren') return;
  if(fortschritt > 0){
    T.ruehrSumme += fortschritt;
    if(Math.random()<.12) Ton.blubb();
  } else {
    T.ruehrSumme = Math.max(0, T.ruehrSumme + fortschritt*0.6);
    T.wackeln = Math.max(T.wackeln, .35);
  }
  const runden = Math.floor(T.ruehrSumme / (Math.PI*2));
  if(runden !== T.ruehrRunden){
    T.ruehrRunden = runden;
    Ton.note(400+runden*80,.1,'sine',.07);
  }
  const rz = $('#tRunden');
  if(rz) rz.textContent = Math.min(runden, sch.runden)+' / '+sch.runden+' Runden';
  if(runden >= sch.runden && T.ruehrPhase === 0){
    T.ruehrPhase = 1;
    $('#tPraez').style.display = 'block';
    const g = gruenZone(T.stufe);
    $('#tZone').style.left = ((0.5 - g/2)*100)+'%';
    $('#tZone').style.width = (g*100)+'%';
    $('#tHinweis').textContent = 'Jetzt loslassen — im grünen Feld!';
  }
}
function ruehrEnde(e){
  if(!T.haelt) return;
  T.haelt = false;
  const sch = aktuellerSchritt(); if(!sch || sch.t!=='ruehren') return;
  if(T.ruehrPhase === 1){
    const g = gruenZone(T.stufe);
    const drin = Math.abs(T.marker - .5) <= g/2;
    $('#tPraez').style.display = 'none';
    if(drin){ schrittGeschafft(true); }
    else {
      if(!T.tutorial) T.qualitaet = Math.max(1, T.qualitaet - .5);
      fliegMitte('Fast!', '#E8D48A');
      schrittGeschafft(false);
    }
  } else {
    $('#tHinweis').textContent = 'Weiterrühren — noch nicht genug!';
  }
}
function trankTaste(e){
  if(!T.aktiv) return;
  const sch = aktuellerSchritt();
  if(e.key === 'Escape'){ trankPause(); return; }
  if(!sch || sch.t !== 'ruehren') return;
  if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
    e.preventDefault();
    const richtung = e.key === 'ArrowRight' ? 1 : -1;
    T.haelt = true; T.tasteRichtung = richtung * sch.dir;
  }
  if((e.key === ' ' || e.key === 'Enter') && T.ruehrPhase === 1){
    e.preventDefault(); T.haelt = true; ruehrEnde({});
    T.tasteRichtung = 0;
  }
}
function trankTasteAuf(e){
  if(!T.aktiv) return;
  if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
    T.tasteRichtung = 0;
    if(T.ruehrPhase === 1){ ruehrEnde({}); }
    else T.haelt = false;
  }
}

/* ---------- Abschluss ---------- */
function trankPause(){
  if(!T.aktiv) return;
  T.aktiv = false;
  const d = dialog('<h2 class="serif zentriert" style="color:#20264A">Pause</h2>'+
    '<p class="zentriert" style="color:#5A6288;margin:0 0 14px">Der Kessel wartet auf dich.</p>'+
    '<div class="reihe"><button class="btn" data-weiter>Weiterspielen</button>'+
    '<button class="btn geist" data-raus style="color:#20264A;border-color:rgba(40,60,110,.4)">Zurück zum Plan</button></div>',
    {klickAussen:false});
  d.el.querySelector('[data-weiter]').onclick = ()=>{
    Ton.klick(); d.schliessen(); T.aktiv = true; T.letzteZeit = performance.now();
    cancelAnimationFrame(T.raf); T.raf = requestAnimationFrame(trankSchleife);
  };
  d.el.querySelector('[data-raus]').onclick = ()=>{ Ton.klick(); d.schliessen(); hubZeigen(); };
}

function trankFertig(){
  T.aktiv = false;
  cancelAnimationFrame(T.raf);
  const r = T.rezept;
  const perfekt = T.fehler === 0;
  const meisterwerk = perfekt && !T.tutorial && Math.random() < 0.10;
  let steine = Math.round((14 + T.stufe*2) * (T.qualitaet/3));
  let punkte = Math.round((7 + T.stufe) * (T.qualitaet/3));
  if(meisterwerk){ steine = Math.round(steine*2); punkte = Math.round(punkte*1.5); }
  if(T.tutorial){ steine = 30; punkte = 15; }

  const vorher = S.traenke[r.id];
  S.traenke[r.id] = { anzahl: (vorher?vorher.anzahl:0)+1, meisterwerk: (vorher&&vorher.meisterwerk) || meisterwerk };
  S.stats.gebraut++;
  if(perfekt) S.stats.ohneFehler++; else S.stats.ohneFehler = 0;
  if(meisterwerk) S.stats.meisterwerke++;
  if(T.stufe >= S.trankStufe) S.trankStufe = Math.min(24, T.stufe+1);
  S.steine += steine; S.gesamt += steine;
  const echteP = gibHauspunkte(punkte);
  pruefeAbzeichen(); sichern();
  Ton.toll();

  const stufeText = ['','Ganz ordentlich.','Gut gemacht!','Sehr gut!'][Math.round(T.qualitaet)] || 'Gut gemacht!';
  const inhalt =
    '<div class="zentriert gross-moment">'+
      (meisterwerk ? '<div class="hand" style="font-size:1.5rem;color:#8E7318">✦ Meisterwerk! ✦</div>' : '')+
      '<div style="width:76px;height:76px;margin:6px auto;border-radius:50%;display:grid;place-items:center;'+
        'background:'+r.farbe+'33;border:3px solid '+r.farbe+';color:'+r.farbe+'">'+ico('flasche',42)+'</div>'+
      '<h2 class="serif" style="color:#20264A;margin:0">'+esc(r.name)+'</h2>'+
      '<p class="hand" style="font-size:1.2rem;color:#C0492E;margin:2px 0 6px">'+esc(zufall(NOTIZEN))+'</p>'+
      '<p style="color:#20264A;font-size:.95rem;margin:0 0 10px">'+esc(r.text)+'</p>'+
      '<div class="reihe" style="margin-bottom:12px">'+
        '<span class="chip">+'+steine+' Mondsteine</span>'+
        '<span class="chip">+'+echteP+' Hauspunkte</span>'+
        (perfekt?'<span class="chip">ohne Fehler</span>':'')+
      '</div>'+
      '<div style="color:#5A6288;font-size:.9rem;margin-bottom:12px">'+stufeText+'</div>'+
      '<div class="reihe">'+
        (T.tutorial ? '<button class="btn" data-hub>Zum Stundenplan</button>'
          : '<button class="btn" data-nochmal>Nächste Stunde</button>'+
            '<button class="btn geist" data-hub style="color:#20264A;border-color:rgba(40,60,110,.4)">Zum Plan</button>')+
      '</div>'+
    '</div>';
  const d = dialog(inhalt, {klickAussen:false});
  const n = d.el.querySelector('[data-nochmal]');
  if(n) n.onclick = ()=>{ Ton.klick(); d.schliessen(); trankStarten(S.trankStufe, false); };
  d.el.querySelector('[data-hub]').onclick = ()=>{ Ton.klick(); d.schliessen(); hubZeigen(); };
}

function trankZeitAus(){
  T.aktiv = false; cancelAnimationFrame(T.raf);
  const steine = 5 + T.stufe;
  S.steine += steine; S.gesamt += steine; S.stats.ohneFehler = 0; sichern();
  const d = dialog('<div class="zentriert">'+
    '<div class="hand" style="font-size:1.4rem;color:#C0492E">Die Zeit ist um.</div>'+
    '<p style="color:#20264A;margin:6px 0 10px">Der Trank ist trüb geworden — aber der Kessel ist heil. '+
    'Probier es gleich noch einmal.</p>'+
    '<span class="chip">+'+steine+' Mondsteine fürs Aufräumen</span>'+
    '<div class="reihe" style="margin-top:14px"><button class="btn" data-nochmal>Noch einmal</button>'+
    '<button class="btn geist" data-hub style="color:#20264A;border-color:rgba(40,60,110,.4)">Zum Plan</button></div></div>',
    {klickAussen:false});
  d.el.querySelector('[data-nochmal]').onclick = ()=>{ Ton.klick(); d.schliessen(); trankStarten(T.stufe,false); };
  d.el.querySelector('[data-hub]').onclick = ()=>{ Ton.klick(); d.schliessen(); hubZeigen(); };
}

/* ---------- Zeichnen ---------- */
function mischFarbe(a,b,t){
  const p = h => [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const A = p(a), B = p(b);
  const c = A.map((v,i)=>Math.round(v + (B[i]-v)*klemm(t,0,1)));
  return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
}
function farbSpritzer(f){
  for(let i=0;i<10;i++) T.blubber.push({x:Math.random(), y:1, r:2+Math.random()*4, v:.3+Math.random()*.5, f:f});
}

function trankSchleife(jetzt){
  if(!T.aktiv) return;
  const dt = Math.min(.05, (jetzt - T.letzteZeit)/1000);
  T.letzteZeit = jetzt;

  /* Zeit */
  if(T.zeitMax < 900){
    T.zeit -= dt;
    const zb = $('#tZeit');
    if(zb){
      zb.firstElementChild.style.width = Math.max(0, T.zeit/T.zeitMax*100)+'%';
      zb.classList.toggle('eilig', T.zeit < T.zeitMax*.28);
    }
    if(T.zeit <= 0){ trankZeitAus(); return; }
  }
  /* Warten */
  if(T.warten && jetzt >= T.wartenBis){
    T.warten = false;
    const wb = $('#tWarten'); if(wb) wb.disabled = false;
    schrittGeschafft(false);
  }
  /* Tastatur-Rühren */
  if(T.tasteRichtung !== 0 && T.ruehrPhase === 0) ruehrFortschritt(T.tasteRichtung * dt * 4.2);
  /* Präzisionsmarker */
  if(T.ruehrPhase === 1){
    T.marker += T.markerRichtung * dt * (0.85 + T.stufe*0.03);
    if(T.marker > 1){ T.marker = 1; T.markerRichtung = -1; }
    if(T.marker < 0){ T.marker = 0; T.markerRichtung = 1; }
    const m = $('#tMarker'); if(m) m.style.left = 'calc('+(T.marker*100)+'% - 2.5px)';
  }
  T.farbe = mischFarbe(T.farbe, T.zielFarbe, dt*3);
  T.wackeln = Math.max(0, T.wackeln - dt*2);
  T.glanz = Math.max(0, T.glanz - dt*1.6);

  kesselZeichnen(dt, jetzt);
  T.raf = requestAnimationFrame(trankSchleife);
}

function kesselZeichnen(dt, jetzt){
  const c = T.ctx, w = T.bw, h = T.bh;
  if(!c || !w) return;
  c.clearRect(0,0,w,h);
  const cx = w/2;
  const wack = Math.sin(jetzt/40)*T.wackeln*4;
  c.save(); c.translate(cx + wack, 0);

  const kr = w*0.36;              /* Kesselradius */
  const ky = h*0.50;              /* Mittelpunkt Kessel */

  /* Flamme */
  const fH = 10 + T.flamme*13;
  for(let i=0;i<9;i++){
    const t = (jetzt/120 + i)%1;
    const fx = (i-4)*(kr*0.20);
    const fy = ky + kr*0.86;
    const g = c.createRadialGradient(fx, fy-t*fH, 1, fx, fy-t*fH, 12+T.flamme*4);
    g.addColorStop(0,'rgba(255,220,140,'+(0.55*(1-t))+')');
    g.addColorStop(.5,'rgba(232,120,40,'+(0.35*(1-t))+')');
    g.addColorStop(1,'rgba(232,120,40,0)');
    c.fillStyle = g; c.beginPath(); c.arc(fx, fy-t*fH, 12+T.flamme*4, 0, 7); c.fill();
  }

  /* Glut unter dem Kessel */
  c.fillStyle = 'rgba(232,120,40,'+(0.10+T.flamme*0.06)+')';
  c.beginPath(); c.ellipse(0, ky+kr*0.9, kr*0.85, kr*0.16, 0, 0, 7); c.fill();

  /* Kesselkörper */
  c.save();
  c.beginPath();
  c.moveTo(-kr, ky-kr*0.42);
  c.quadraticCurveTo(-kr*1.06, ky+kr*0.62, 0, ky+kr*0.72);
  c.quadraticCurveTo(kr*1.06, ky+kr*0.62, kr, ky-kr*0.42);
  c.closePath();
  const kg = c.createLinearGradient(-kr,ky-kr,kr,ky+kr);
  kg.addColorStop(0,'#3A4057'); kg.addColorStop(.45,'#232840'); kg.addColorStop(1,'#12162A');
  c.fillStyle = kg; c.fill();
  c.strokeStyle = '#C9A227'; c.lineWidth = 2.4; c.stroke();
  c.restore();

  /* Flüssigkeit */
  c.save();
  c.beginPath(); c.ellipse(0, ky-kr*0.42, kr*0.94, kr*0.30, 0, 0, 7); c.clip();
  c.fillStyle = T.farbe;
  c.fillRect(-kr, ky-kr*0.9, kr*2, kr*1.2);
  /* Wellen */
  c.globalAlpha = .30; c.fillStyle = '#fff';
  for(let i=0;i<3;i++){
    c.beginPath();
    const off = Math.sin(jetzt/500 + i)*kr*0.16;
    c.ellipse(off, ky-kr*0.46 + i*3, kr*0.5 - i*8, 4, 0, 0, 7); c.fill();
  }
  c.globalAlpha = 1;
  /* Blasen */
  for(let i=T.blubber.length-1;i>=0;i--){
    const b = T.blubber[i];
    b.y -= b.v*dt*1.6;
    if(b.y < 0.05){ T.blubber.splice(i,1); continue; }
    c.globalAlpha = .55;
    c.fillStyle = b.f || '#ffffff';
    c.beginPath(); c.arc((b.x-.5)*kr*1.7, ky-kr*0.42 + (b.y-.5)*kr*0.5, b.r, 0, 7); c.fill();
  }
  c.globalAlpha = 1;
  c.restore();

  /* neue Blasen je nach Flamme */
  if(Math.random() < .06 + T.flamme*.05){
    T.blubber.push({x:Math.random(), y:1, r:2+Math.random()*3, v:.25+Math.random()*.4, f:null});
    if(Math.random()<.10 && S.ton) Ton.blubb();
  }

  /* Rand */
  c.beginPath(); c.ellipse(0, ky-kr*0.42, kr*0.96, kr*0.31, 0, 0, 7);
  c.strokeStyle = '#C9A227'; c.lineWidth = 3; c.stroke();

  /* Dampf */
  c.globalAlpha = .16 + T.flamme*.05;
  for(let i=0;i<3;i++){
    const t = ((jetzt/1400) + i/3)%1;
    c.beginPath();
    c.arc(Math.sin(jetzt/700+i*2)*kr*0.3, ky-kr*0.5 - t*kr*0.9, 8+t*20, 0, 7);
    c.fillStyle = T.farbe; c.fill();
  }
  c.globalAlpha = 1;

  /* Rührwirbel */
  const sch = T.aktiv ? aktuellerSchritt() : null;
  if(sch && sch.t === 'ruehren'){
    const p = klemm(T.ruehrSumme/(Math.PI*2*sch.runden), 0, 1);
    c.save();
    c.translate(0, ky-kr*0.42);
    c.scale(1, 0.32);
    c.beginPath(); c.arc(0,0, kr*0.68, -Math.PI/2, -Math.PI/2 + p*Math.PI*2*sch.dir, sch.dir<0);
    c.strokeStyle = T.ruehrPhase===1 ? '#8FE08A' : '#DDE5F8';
    c.lineWidth = 8; c.lineCap = 'round'; c.stroke();
    /* Richtungspfeil */
    c.beginPath(); c.arc(0,0, kr*0.68, 0, 7);
    c.strokeStyle = 'rgba(221,229,248,.22)'; c.lineWidth = 8; c.stroke();
    c.restore();
    const a = -Math.PI/2 + (jetzt/500)*sch.dir;
    c.fillStyle = 'rgba(221,229,248,.85)';
    c.beginPath();
    c.arc(Math.cos(a)*kr*0.68, ky-kr*0.42 + Math.sin(a)*kr*0.68*0.32, 5, 0, 7); c.fill();
  }

  /* Glanz nach gutem Schritt */
  if(T.glanz > 0){
    c.globalAlpha = T.glanz*.55;
    const g = c.createRadialGradient(0, ky-kr*0.42, 4, 0, ky-kr*0.42, kr*1.4);
    g.addColorStop(0,'#fff'); g.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, ky-kr*0.42, kr*1.4, 0, 7); c.fill();
    c.globalAlpha = 1;
  }
  c.restore();
}


/* ===== flight.js ===== */
/* ============================================================
   MINI-SPIEL 2 — BESENFLUG (Canvas, 60 fps)
   ============================================================ */

const F = {
  aktiv:false, pause:false, canvas:null, ctx:null, raf:null, letzte:0,
  w:0, h:0, dpr:1,
  y:0, zielY:0, neigung:0,
  tempo:1, tempoStufe:0, laufzeit:0, strecke:0,
  punkte:0, kugelnGezaehlt:0, leben:3, unverwundbar:0, bremse:0,
  objekte:[], kugeln:[], power:[], teilchen:[], sterne:[], baeume:[], berge:[],
  naechsteKugel:0, naechstesHindernis:0, naechsteGold:0, naechsterPower:0,
  zeitlupe:0, schild:0, magnet:0, turbo:0,
  tasten:{}, zeigerAktiv:false, besen:null, meldung:'', meldungZeit:0, neuerRekord:false
};

const HINDERNIS_TYPEN = ['turm','ast','wolke','raben'];

function flugStarten(){
  const s = $('#szene-flug');
  s.innerHTML =
    '<canvas id="flugCanvas"></canvas>'+
    '<div class="flug-hud">'+
      '<div><div class="pkt" id="fPkt">0</div><div class="best" id="fBest">Bestleistung: '+S.flugBest+'</div></div>'+
      '<div class="leben" id="fLeben"></div>'+
    '</div>'+
    '<button class="ikon-btn flug-pause" id="fPause" aria-label="Pause">'+ico('pause',20)+'</button>'+
    '<div class="powerhinweis" id="fMeldung"></div>';

  F.canvas = $('#flugCanvas'); F.ctx = F.canvas.getContext('2d', {alpha:false});
  flugGroesse();
  window.addEventListener('resize', flugGroesse);

  F.besen = BESEN.find(b => b.id === S.aktiv.besen) || BESEN[0];
  F.aktiv = true; F.pause = false;
  F.h = F.canvas.clientHeight;
  F.y = F.h*0.5; F.zielY = F.y; F.neigung = 0;
  F.tempo = 1; F.tempoStufe = S.jahr2 ? 2 : 0; F.laufzeit = S.jahr2 ? 30 : 0; F.strecke = 0;
  F.punkte = 0; F.kugelnGezaehlt = 0; F.leben = 3; F.unverwundbar = 0; F.bremse = 0;
  F.objekte.length = 0; F.kugeln.length = 0; F.power.length = 0; F.teilchen.length = 0;
  F.zeitlupe = 0; F.schild = 0; F.magnet = 0; F.turbo = 0;
  F.naechsteKugel = .6; F.naechstesHindernis = 1.6; F.naechsteGold = 20; F.naechsterPower = 12;
  F.meldung = ''; F.neuerRekord = false; F.tasten = {};

  F.sterne = [];
  for(let i=0;i<70;i++) F.sterne.push({x:Math.random(), y:Math.random()*.7, r:Math.random()*1.5+.4, s:Math.random()*.35+.06});
  F.berge = []; for(let i=0;i<12;i++) F.berge.push({x:i*160, hh:60+Math.random()*90, b:120+Math.random()*90});
  F.baeume = []; for(let i=0;i<26;i++) F.baeume.push({x:i*90, hh:50+Math.random()*70, b:30+Math.random()*24});

  lebenZeichnen();
  F.canvas.addEventListener('pointerdown', flugZeigerAb);
  F.canvas.addEventListener('pointermove', flugZeigerBewegt);
  F.canvas.addEventListener('pointerup', flugZeigerAuf);
  F.canvas.addEventListener('pointercancel', flugZeigerAuf);
  document.addEventListener('keydown', flugTasteAb);
  document.addEventListener('keyup', flugTasteAuf);
  $('#fPause').onclick = flugPause;

  F.letzte = performance.now();
  cancelAnimationFrame(F.raf);
  F.raf = requestAnimationFrame(flugSchleife);
}

beimVerlassen['flug'] = ()=>{
  F.aktiv = false; cancelAnimationFrame(F.raf);
  document.removeEventListener('keydown', flugTasteAb);
  document.removeEventListener('keyup', flugTasteAuf);
  window.removeEventListener('resize', flugGroesse);
};

function flugGroesse(){
  if(!F.canvas) return;
  const r = F.canvas.getBoundingClientRect();
  F.dpr = Math.min(window.devicePixelRatio||1, 2);
  F.canvas.width = Math.max(1, Math.round(r.width*F.dpr));
  F.canvas.height = Math.max(1, Math.round(r.height*F.dpr));
  F.ctx.setTransform(F.dpr,0,0,F.dpr,0,0);
  F.w = r.width; F.h = r.height;
  F.zielY = klemm(F.zielY, 30, F.h-30);
}

/* ---------- Steuerung ---------- */
function flugZeigerAb(e){ e.preventDefault(); F.zeigerAktiv = true; F.zielY = e.clientY - F.canvas.getBoundingClientRect().top; }
function flugZeigerBewegt(e){ if(!F.zeigerAktiv) return; e.preventDefault(); F.zielY = e.clientY - F.canvas.getBoundingClientRect().top; }
function flugZeigerAuf(){ F.zeigerAktiv = false; }
function flugTasteAb(e){
  if(!F.aktiv && !F.pause) return;
  if(e.key === 'Escape' || e.key === 'p'){ flugPause(); return; }
  if(['ArrowUp','ArrowDown','w','s',' '].includes(e.key)){ e.preventDefault(); F.tasten[e.key] = true; }
}
function flugTasteAuf(e){ F.tasten[e.key] = false; }

function flugPause(){
  if(!F.aktiv && !F.pause) return;
  if(F.pause) return;
  F.aktiv = false; F.pause = true;
  cancelAnimationFrame(F.raf);
  const d = dialog('<h2 class="serif zentriert" style="color:#20264A">Pause</h2>'+
    '<p class="zentriert" style="color:#5A6288;margin:0 0 6px">Punkte: <b>'+Math.floor(F.punkte)+'</b></p>'+
    '<p class="zentriert klein" style="color:#5A6288;margin:0 0 14px">Ziehen mit dem Finger oder Pfeiltasten ↑ ↓</p>'+
    '<div class="reihe"><button class="btn" data-weiter>Weiterfliegen</button>'+
    '<button class="btn geist" data-raus style="color:#20264A;border-color:rgba(40,60,110,.4)">Zum Plan</button></div>',
    {klickAussen:false});
  d.el.querySelector('[data-weiter]').onclick = ()=>{
    Ton.klick(); d.schliessen(); F.pause = false; F.aktiv = true;
    F.letzte = performance.now(); F.raf = requestAnimationFrame(flugSchleife);
  };
  d.el.querySelector('[data-raus]').onclick = ()=>{ Ton.klick(); d.schliessen(); F.pause = false; hubZeigen(); };
}

function lebenZeichnen(){
  const l = $('#fLeben'); if(!l) return;
  l.innerHTML = [0,1,2].map(i => '<i class="'+(i < F.leben ? '' : 'weg')+'"></i>').join('');
}
function meldung(text){ F.meldung = text; F.meldungZeit = 1.6; const m=$('#fMeldung'); if(m) m.textContent = text; }

/* ---------- Spielschleife ---------- */
function flugSchleife(jetzt){
  if(!F.aktiv) return;
  let dt = Math.min(.048, (jetzt - F.letzte)/1000);
  F.letzte = jetzt;
  const zl = F.zeitlupe > 0 ? .45 : 1;
  flugRechnen(dt, dt*zl);
  flugMalen(jetzt);
  F.raf = requestAnimationFrame(flugSchleife);
}

function flugRechnen(dtEcht, dt){
  F.laufzeit += dtEcht;

  /* Timer für Effekte */
  ['zeitlupe','schild','magnet','turbo'].forEach(k => { if(F[k] > 0) F[k] = Math.max(0, F[k]-dtEcht); });
  if(F.unverwundbar > 0) F.unverwundbar -= dtEcht;
  if(F.bremse > 0) F.bremse -= dtEcht;
  if(F.meldungZeit > 0){ F.meldungZeit -= dtEcht; if(F.meldungZeit <= 0){ const m=$('#fMeldung'); if(m) m.textContent=''; } }

  /* Tempo: alle 15 s schneller */
  const stufe = Math.floor(F.laufzeit/15);
  if(stufe > F.tempoStufe){ F.tempoStufe = stufe; meldung('Schneller!'); Ton.note(700,.16,'triangle',.08); }
  const grund = (1 + F.tempoStufe*0.14) * F.besen.tempo;
  const bremsF = F.bremse > 0 ? .5 : 1;
  const turboF = F.turbo > 0 ? 1.5 : 1;
  F.tempo = grund * bremsF * turboF;
  const v = 250 * F.tempo;
  F.strecke += v*dt;
  F.punkte += v*dt*0.045;

  /* Steuerung */
  const wendig = 7.5 * F.besen.wendig;
  if(F.tasten['ArrowUp'] || F.tasten['w'] || F.tasten[' ']) F.zielY -= 340*dtEcht;
  if(F.tasten['ArrowDown'] || F.tasten['s']) F.zielY += 340*dtEcht;
  if(!F.zeigerAktiv && !F.tasten['ArrowUp'] && !F.tasten['w'] && !F.tasten[' '] && !F.tasten['ArrowDown'] && !F.tasten['s']){
    F.zielY += 46*dtEcht;
  }
  F.zielY = klemm(F.zielY, 34, F.h-34);
  const alt = F.y;
  F.y += (F.zielY - F.y) * Math.min(1, wendig*dtEcht);
  F.y = klemm(F.y, 26, F.h-26);
  F.neigung = klemm((F.y-alt)/(dtEcht*900), -1, 1);

  /* Spawnen */
  F.naechsteKugel -= dt; F.naechstesHindernis -= dt; F.naechsteGold -= dtEcht; F.naechsterPower -= dtEcht;
  if(F.naechsteKugel <= 0){ kugelnSpawnen(); F.naechsteKugel = 1.1 + Math.random()*0.9; }
  if(F.naechstesHindernis <= 0){ hindernisSpawnen(); F.naechstesHindernis = Math.max(0.85, 2.1 - F.tempoStufe*0.13) + Math.random()*0.7; }
  if(F.naechsteGold <= 0){ goldSpawnen(); F.naechsteGold = 18 + Math.random()*6; }
  if(F.naechsterPower <= 0){ powerSpawnen(); F.naechsterPower = 13 + Math.random()*7; }

  const px = F.w*0.24;

  /* Kugeln */
  for(let i=F.kugeln.length-1;i>=0;i--){
    const k = F.kugeln[i];
    k.x -= v*dt;
    if(F.magnet > 0){
      const dx = px - k.x, dy = F.y - k.y, d = Math.hypot(dx,dy);
      if(d < 230){ k.x += dx/d*300*dt; k.y += dy/d*300*dt; }
    }
    if(k.x < -40){ F.kugeln.splice(i,1); continue; }
    if(Math.abs(k.x-px) < 22 && Math.abs(k.y-F.y) < 22){
      F.kugeln.splice(i,1);
      F.kugelnGezaehlt++;
      F.punkte += k.gold ? 50 : 10;
      if(k.gold){ meldung('Goldene Kugel! ×5'); Ton.toll(); }
      else Ton.note(880+Math.random()*180,.07,'triangle',.06);
      for(let n=0;n<(k.gold?18:7);n++) F.teilchen.push({x:k.x,y:k.y,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220,l:.5,f:k.gold?'#E8D48A':'#DDE5F8'});
    }
  }

  /* Powerups */
  for(let i=F.power.length-1;i>=0;i--){
    const p = F.power[i];
    p.x -= v*dt;
    if(p.x < -40){ F.power.splice(i,1); continue; }
    if(Math.abs(p.x-px) < 26 && Math.abs(p.y-F.y) < 26){
      F.power.splice(i,1); powerNehmen(p.typ);
    }
  }

  /* Hindernisse */
  for(let i=F.objekte.length-1;i>=0;i--){
    const o = F.objekte[i];
    o.x -= v*dt*(o.typ==='raben' ? 1.25 : 1);
    if(o.typ==='wolke') o.y = o.y0 + Math.sin(F.laufzeit*1.4 + o.ph)*26;
    if(o.typ==='raben') o.y = o.y0 + Math.sin(F.laufzeit*2.6 + o.ph)*40;
    if(o.x < -o.b-40){ F.objekte.splice(i,1); continue; }
    if(F.unverwundbar > 0) continue;
    if(trifft(o, px, F.y)) treffer(o);
  }

  /* Teilchen */
  for(let i=F.teilchen.length-1;i>=0;i--){
    const t = F.teilchen[i];
    t.x += t.vx*dt - v*dt*.5; t.y += t.vy*dt; t.l -= dtEcht*1.8;
    if(t.l <= 0) F.teilchen.splice(i,1);
  }

  const pk = $('#fPkt'); if(pk) pk.textContent = Math.floor(F.punkte);
  if(!F.neuerRekord && S.flugBest > 0 && F.punkte > S.flugBest){
    F.neuerRekord = true; meldung('Neue Bestleistung!'); Ton.stufe();
  }
}

function trifft(o, px, py){
  const rx = 17, ry = 15;
  return px+rx > o.x && px-rx < o.x+o.b && py+ry > o.y && py-ry < o.y+o.hh;
}

function kugelnSpawnen(){
  const art = Math.random();
  const basis = 70 + Math.random()*(F.h-160);
  const n = 3 + Math.floor(Math.random()*4);
  for(let i=0;i<n;i++){
    let y = basis;
    if(art < .34) y = basis + Math.sin(i*.9)*46;
    else if(art < .67) y = basis + i*20;
    F.kugeln.push({ x: F.w + 40 + i*38, y: klemm(y, 44, F.h-44), gold:false, ph:Math.random()*7 });
  }
}
function goldSpawnen(){
  F.kugeln.push({ x: F.w + 60, y: 70 + Math.random()*(F.h-140), gold:true, ph:0 });
}
function powerSpawnen(){
  const typ = zufall(['zeitlupe','schild','magnet','turbo']);
  F.power.push({ x: F.w + 50, y: 70 + Math.random()*(F.h-140), typ:typ });
}
function hindernisSpawnen(){
  const typ = zufall(HINDERNIS_TYPEN);
  const x = F.w + 60;
  if(typ === 'turm'){
    const hh = 70 + Math.random()*(F.h*0.36);
    F.objekte.push({ typ, x, y: F.h-hh, b: 46, hh: hh, y0:0, ph:0 });
  } else if(typ === 'ast'){
    const hh = 60 + Math.random()*(F.h*0.32);
    F.objekte.push({ typ, x, y: 0, b: 40, hh: hh, y0:0, ph:0 });
  } else if(typ === 'wolke'){
    const y = 60 + Math.random()*(F.h-190);
    F.objekte.push({ typ, x, y, y0:y, b: 96, hh: 58, ph: Math.random()*7 });
  } else {
    const y = 60 + Math.random()*(F.h-180);
    F.objekte.push({ typ, x, y, y0:y, b: 84, hh: 46, ph: Math.random()*7 });
  }
}

function powerNehmen(typ){
  if(typ==='zeitlupe'){ F.zeitlupe = 5; meldung('Zeitlupe'); }
  if(typ==='schild'){ F.schild = 99; meldung('Schutzschild'); }
  if(typ==='magnet'){ F.magnet = 8; meldung('Sternenmagnet'); }
  if(typ==='turbo'){ F.turbo = 4; meldung('Turbo!'); }
  Ton.gut();
  for(let n=0;n<16;n++) F.teilchen.push({x:F.w*0.24,y:F.y,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,l:.6,f:'#8FE0FF'});
}

function treffer(o){
  if(F.schild > 0){
    F.schild = 0; F.unverwundbar = 1.2; meldung('Schild hält!');
    Ton.note(300,.2,'square',.08);
    for(let n=0;n<20;n++) F.teilchen.push({x:F.w*0.24,y:F.y,vx:(Math.random()-.5)*300,vy:(Math.random()-.5)*300,l:.6,f:'#8FE0FF'});
    return;
  }
  F.leben--; F.unverwundbar = 1.5; F.bremse = 1.2;
  if(F.kugelnGezaehlt > 0){ F.kugelnGezaehlt--; F.punkte = Math.max(0, F.punkte-10); }
  lebenZeichnen(); Ton.schlecht();
  meldung(F.leben > 0 ? 'Autsch! Noch '+F.leben+' …' : '');
  for(let n=0;n<22;n++) F.teilchen.push({x:F.w*0.24,y:F.y,vx:(Math.random()-.5)*300,vy:(Math.random()-.5)*300,l:.7,f:'#E8A33A'});
  if(F.leben <= 0) flugEnde();
}

function flugEnde(){
  F.aktiv = false; cancelAnimationFrame(F.raf);
  const punkte = Math.floor(F.punkte);
  const rekord = punkte > S.flugBest;
  if(rekord) S.flugBest = punkte;
  S.stats.fluege++;
  S.stats.maxKugeln = Math.max(S.stats.maxKugeln||0, F.kugelnGezaehlt);
  let steine = Math.floor(punkte/18);
  if(S.ereignis && S.ereignis.effekt.flugBonus) steine = Math.round(steine*1.4);
  const punkteHaus = Math.floor(punkte/40) + 3;
  S.steine += steine; S.gesamt += steine;
  const echteP = gibHauspunkte(punkteHaus);
  pruefeAbzeichen(); sichern();
  Ton.toll();

  const d = dialog('<div class="zentriert gross-moment">'+
    (rekord ? '<div class="hand gross" style="color:#8E7318;font-size:1.6rem">Neue Bestleistung!</div>' : '')+
    '<h2 class="serif" style="color:#20264A;margin:4px 0 2px">Runde beendet</h2>'+
    '<div class="gotisch" style="color:#20264A;font-size:2.4rem;line-height:1">'+punkte+'</div>'+
    '<p class="klein" style="color:#5A6288;margin:2px 0 10px">'+F.kugelnGezaehlt+' Kugeln gefangen · Bestleistung '+S.flugBest+'</p>'+
    '<div class="reihe" style="margin-bottom:12px">'+
      '<span class="chip">+'+steine+' Mondsteine</span><span class="chip">+'+echteP+' Hauspunkte</span></div>'+
    '<div class="reihe"><button class="btn" data-nochmal>Noch einmal</button>'+
    '<button class="btn geist" data-hub style="color:#20264A;border-color:rgba(40,60,110,.4)">Zum Plan</button></div></div>',
    {klickAussen:false});
  d.el.querySelector('[data-nochmal]').onclick = ()=>{ Ton.klick(); d.schliessen(); flugStarten(); };
  d.el.querySelector('[data-hub]').onclick = ()=>{ Ton.klick(); d.schliessen(); hubZeigen(); };
}

/* ---------- Zeichnen ---------- */
function flugMalen(jetzt){
  const c = F.ctx, w = F.w, h = F.h;
  const t = jetzt/1000;

  /* Himmel */
  const g = c.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#0B1024'); g.addColorStop(.5,'#1B2145'); g.addColorStop(1,'#232A4E');
  c.fillStyle = g; c.fillRect(0,0,w,h);

  /* Sterne */
  c.fillStyle = '#DDE5F8';
  for(const s of F.sterne){
    const x = ((s.x*w - F.strecke*s.s*0.14) % (w+20) + w+20) % (w+20);
    c.globalAlpha = .35 + Math.sin(t*2+s.x*30)*.3;
    c.fillRect(x, s.y*h, s.r, s.r);
  }
  c.globalAlpha = 1;

  /* Mond */
  c.fillStyle = 'rgba(221,229,248,.92)';
  c.beginPath(); c.arc(w*0.82, h*0.16, 26, 0, 7); c.fill();
  c.fillStyle = 'rgba(221,229,248,.10)';
  c.beginPath(); c.arc(w*0.82, h*0.16, 54, 0, 7); c.fill();

  /* Berge (weit) */
  c.fillStyle = '#161B36';
  const bOff = (F.strecke*0.16) % 160;
  c.beginPath(); c.moveTo(-200, h);
  for(const b of F.berge){
    const x = b.x - bOff - 200;
    c.lineTo(x, h*0.72 - b.hh*0.5); c.lineTo(x + b.b*0.5, h*0.72 - b.hh); c.lineTo(x + b.b, h*0.72 - b.hh*0.4);
  }
  c.lineTo(w+300, h); c.closePath(); c.fill();

  /* Nebel */
  c.fillStyle = 'rgba(154,168,192,.13)';
  for(let i=0;i<4;i++){
    const x = ((i*260 - F.strecke*0.28) % (w+520)) - 260;
    c.beginPath(); c.ellipse(x, h*0.70 + Math.sin(t*.6+i)*8, 190, 34, 0, 0, 7); c.fill();
  }

  /* Wald (nah) */
  c.fillStyle = '#0E1226';
  const tOff = (F.strecke*0.55) % 90;
  for(const b of F.baeume){
    const x = b.x - tOff - 90;
    c.beginPath();
    c.moveTo(x, h); c.lineTo(x + b.b*0.5, h - b.hh); c.lineTo(x + b.b, h); c.closePath(); c.fill();
  }
  c.fillStyle = '#0A0D1E'; c.fillRect(0, h-18, w, 18);

  /* Hindernisse */
  for(const o of F.objekte) hindernisMalen(c, o, t);

  /* Kugeln */
  for(const k of F.kugeln){
    const r = k.gold ? 13 : 9;
    const gg = c.createRadialGradient(k.x, k.y, 1, k.x, k.y, r*2.2);
    gg.addColorStop(0, k.gold ? '#FFF3C4' : '#FFFFFF');
    gg.addColorStop(.4, k.gold ? '#E8D48A' : '#DDE5F8');
    gg.addColorStop(1, 'rgba(221,229,248,0)');
    c.fillStyle = gg; c.beginPath(); c.arc(k.x, k.y, r*2.2, 0, 7); c.fill();
    c.fillStyle = k.gold ? '#F6E3A0' : '#EDF2FF';
    c.beginPath(); c.arc(k.x, k.y, r*.62, 0, 7); c.fill();
  }

  /* Powerups */
  for(const p of F.power) powerMalen(c, p, t);

  /* Teilchen */
  for(const p of F.teilchen){
    c.globalAlpha = Math.max(0, p.l);
    c.fillStyle = p.f; c.fillRect(p.x-2, p.y-2, 4, 4);
  }
  c.globalAlpha = 1;

  /* Begleiter */
  if(S.aktiv.begleiter){
    const b = BEGLEITER.find(x=>x.id===S.aktiv.begleiter);
    if(b){
      const bx = F.w*0.24 - 52, by = F.y + 26 + Math.sin(t*4)*7;
      c.fillStyle = b.farbe;
      c.beginPath(); c.ellipse(bx, by, 10, 8, 0, 0, 7); c.fill();
      c.beginPath(); c.ellipse(bx+8, by-5, 6, 5.5, 0, 0, 7); c.fill();
      c.fillStyle = 'rgba(255,255,255,.55)';
      c.beginPath(); c.ellipse(bx-3, by-6+Math.sin(t*12)*3, 7, 3.5, -.4, 0, 7); c.fill();
    }
  }

  /* Spieler */
  spielerMalen(c, t);

  /* Zeitlupen-Schleier */
  if(F.zeitlupe > 0){ c.fillStyle = 'rgba(143,184,217,.10)'; c.fillRect(0,0,w,h); }
}

function hindernisMalen(c, o, t){
  if(o.typ === 'turm'){
    c.fillStyle = '#171C36'; c.fillRect(o.x, o.y, o.b, o.hh);
    c.strokeStyle = '#39406B'; c.lineWidth = 2; c.strokeRect(o.x+.5, o.y+.5, o.b-1, o.hh);
    c.fillStyle = '#0E1228';
    for(let i=0;i<4;i++) c.fillRect(o.x+6+(i%2)*20, o.y+18+i*30, 10, 14);
    c.fillStyle = '#E8D48A';
    c.fillRect(o.x+10, o.y+22, 6, 9);
    c.fillStyle = '#171C36';
    c.beginPath(); c.moveTo(o.x-6, o.y); c.lineTo(o.x+o.b/2, o.y-20); c.lineTo(o.x+o.b+6, o.y); c.closePath(); c.fill();
  } else if(o.typ === 'ast'){
    c.strokeStyle = '#2A2418'; c.lineWidth = 12; c.lineCap = 'round';
    c.beginPath(); c.moveTo(o.x+o.b/2, -6); c.lineTo(o.x+o.b/2, o.hh); c.stroke();
    c.lineWidth = 6;
    c.beginPath(); c.moveTo(o.x+o.b/2, o.hh*0.45); c.lineTo(o.x+o.b/2-22, o.hh*0.62); c.stroke();
    c.beginPath(); c.moveTo(o.x+o.b/2, o.hh*0.7); c.lineTo(o.x+o.b/2+20, o.hh*0.86); c.stroke();
    c.fillStyle = '#2F4A2C';
    for(let i=0;i<6;i++){
      const yy = 14 + i*(o.hh/6);
      c.beginPath(); c.ellipse(o.x+o.b/2 + (i%2?16:-16), yy, 13, 7, i%2?.5:-.5, 0, 7); c.fill();
    }
  } else if(o.typ === 'wolke'){
    c.fillStyle = 'rgba(58,53,80,.95)';
    c.beginPath();
    c.ellipse(o.x+28, o.y+32, 30, 20, 0, 0, 7);
    c.ellipse(o.x+62, o.y+26, 32, 22, 0, 0, 7);
    c.ellipse(o.x+46, o.y+18, 26, 18, 0, 0, 7);
    c.fill();
    if(Math.sin(t*7 + o.ph) > .72){
      c.strokeStyle = '#E8D48A'; c.lineWidth = 2.6;
      c.beginPath(); c.moveTo(o.x+44, o.y+44); c.lineTo(o.x+36, o.y+58); c.lineTo(o.x+46, o.y+56); c.lineTo(o.x+38, o.y+72); c.stroke();
    }
  } else {
    /* Rabenschwarm */
    c.strokeStyle = '#0B0D18'; c.lineWidth = 3; c.lineCap = 'round';
    for(let i=0;i<5;i++){
      const rx = o.x + (i%3)*30, ry = o.y + Math.floor(i/3)*24 + Math.sin(t*9+i)*4;
      const f = Math.sin(t*13+i)*6;
      c.beginPath(); c.moveTo(rx-9, ry+f); c.quadraticCurveTo(rx, ry-6, rx+9, ry+f); c.stroke();
    }
    c.fillStyle = 'rgba(11,13,24,.45)';
    c.beginPath(); c.ellipse(o.x+o.b/2, o.y+o.hh/2, o.b/2, o.hh/2, 0, 0, 7); c.fill();
  }
}

function powerMalen(c, p, t){
  const farben = { zeitlupe:'#8FB8D9', schild:'#8FE0FF', magnet:'#C9A227', turbo:'#D4553A' };
  const f = farben[p.typ];
  const puls = 1 + Math.sin(t*5)*.12;
  c.save(); c.translate(p.x, p.y); c.scale(puls, puls);
  const gg = c.createRadialGradient(0,0,2,0,0,26);
  gg.addColorStop(0, f); gg.addColorStop(1, 'rgba(0,0,0,0)');
  c.globalAlpha = .5; c.fillStyle = gg; c.beginPath(); c.arc(0,0,26,0,7); c.fill();
  c.globalAlpha = 1;
  c.fillStyle = 'rgba(19,26,51,.92)'; c.strokeStyle = f; c.lineWidth = 2.4;
  c.beginPath(); c.arc(0,0,15,0,7); c.fill(); c.stroke();
  c.strokeStyle = f; c.lineWidth = 2; c.lineCap='round'; c.lineJoin='round';
  c.beginPath();
  if(p.typ==='zeitlupe'){ c.arc(0,0,7,0,7); c.moveTo(0,-5); c.lineTo(0,0); c.lineTo(4,2); }
  else if(p.typ==='schild'){ c.moveTo(0,-8); c.lineTo(7,-4); c.lineTo(7,3); c.lineTo(0,8); c.lineTo(-7,3); c.lineTo(-7,-4); c.closePath(); }
  else if(p.typ==='magnet'){ c.moveTo(-6,6); c.lineTo(-6,-2); c.arc(0,-2,6,Math.PI,0); c.lineTo(6,6); c.moveTo(-6,2); c.lineTo(-2,2); c.moveTo(6,2); c.lineTo(2,2); }
  else { c.moveTo(2,-9); c.lineTo(-5,1); c.lineTo(0,1); c.lineTo(-2,9); c.lineTo(6,-1); c.lineTo(1,-1); c.closePath(); }
  c.stroke();
  c.restore();
}

function spielerMalen(c, t){
  const px = F.w*0.24, py = F.y;
  const blink = F.unverwundbar > 0 && Math.floor(t*14)%2 === 0;
  const haus = HAEUSER[S.haus] || HAEUSER.sternenkauz;
  const umhang = UMHAENGE.find(u=>u.id===S.aktiv.umhang);
  const uFarbe = (umhang && umhang.farbe) ? umhang.farbe : haus.farbe;

  /* Sternenschweif */
  for(let i=0;i<7;i++){
    c.globalAlpha = (1-i/7)*.30;
    c.fillStyle = F.turbo>0 ? '#E8A33A' : haus.farbe;
    c.beginPath(); c.arc(px-22-i*13, py+8+Math.sin(t*8+i)*3, 6-i*0.6, 0, 7); c.fill();
  }
  c.globalAlpha = 1;
  if(blink) c.globalAlpha = .4;

  c.save(); c.translate(px, py); c.rotate(F.neigung*0.28);

  /* Besenstiel */
  c.strokeStyle = '#A97C50'; c.lineWidth = 5; c.lineCap='round';
  c.beginPath(); c.moveTo(-26, 10); c.lineTo(24, 4); c.stroke();
  /* Reisig */
  c.strokeStyle = '#8E6A42'; c.lineWidth = 2;
  for(let i=0;i<6;i++){ c.beginPath(); c.moveTo(-26,10); c.lineTo(-44, 2+i*4); c.stroke(); }

  /* Umhang */
  c.fillStyle = uFarbe;
  c.beginPath();
  c.moveTo(-4,-4); c.quadraticCurveTo(-30, 2+Math.sin(t*9)*4, -34, 16); c.quadraticCurveTo(-16, 8, 2, 6);
  c.closePath(); c.fill();

  /* Körper */
  c.fillStyle = '#2A2E52';
  c.beginPath(); c.ellipse(0, 0, 10, 12, -.18, 0, 7); c.fill();
  /* Kopf */
  c.fillStyle = '#E8C9A0';
  c.beginPath(); c.arc(4, -14, 7.5, 0, 7); c.fill();
  /* Haare/Kapuze */
  c.fillStyle = uFarbe;
  c.beginPath(); c.arc(3, -16, 8, Math.PI*1.05, Math.PI*2.05); c.fill();
  /* Arme */
  c.strokeStyle = '#2A2E52'; c.lineWidth = 4.5; c.lineCap='round';
  c.beginPath(); c.moveTo(2,-2); c.lineTo(16, 3); c.stroke();

  /* Zauberstab-Glanz */
  const stab = STAEBE_LOOK.find(s=>s.id===S.aktiv.stab) || STAEBE_LOOK[0];
  c.globalAlpha = .28; c.fillStyle = stab.farbe;
  c.beginPath(); c.arc(27, 2, 9, 0, 7); c.fill();
  c.globalAlpha = 1; c.fillStyle = '#FFFFFF';
  c.beginPath(); c.arc(27, 2, 2.4, 0, 7); c.fill();
  c.restore();

  /* Schild */
  if(F.schild > 0){
    c.strokeStyle = 'rgba(143,224,255,'+(.55+Math.sin(t*7)*.2)+')';
    c.lineWidth = 3; c.beginPath(); c.arc(px, py, 32, 0, 7); c.stroke();
  }
  /* Magnetring */
  if(F.magnet > 0){
    c.strokeStyle = 'rgba(201,162,39,.32)'; c.lineWidth = 2;
    c.beginPath(); c.arc(px, py, 60+Math.sin(t*6)*8, 0, 7); c.stroke();
  }
  c.globalAlpha = 1;
}


/* ===== hub.js ===== */
/* ============================================================
   HUB — Der lebende Stundenplan, Tagesereignis, Eulenpost,
   Hauspokal, Zauberformeln, Waldausflug
   ============================================================ */

let sitzungGestartet = false;

function sitzungStarten(){
  if(sitzungGestartet) return;
  sitzungGestartet = true;
  /* Ein Schultag = ein neuer Kalendertag oder mehr als vier Stunden Pause.
     Neu laden allein startet keinen neuen Tag. */
  const jetzt = Date.now();
  const neuerTag = !S.ereignis || S.ereignisTag !== heute() || (jetzt - (S.letzteSitzung||0)) > 4*3600*1000;
  if(!neuerTag) return;
  S.letzteSitzung = jetzt;
  S.sitzungen++;
  /* Tagesereignis: eins pro Schultag */
  S.ereignis = zufall(EREIGNISSE);
  S.ereignisTag = heute();
  if(S.ereignis.effekt.steine){ S.steine += S.ereignis.effekt.steine; S.gesamt += S.ereignis.effekt.steine; }
  if(S.ereignis.effekt.zutat){ gibZutat(zufall(ZUTATEN).id, S.ereignis.effekt.zutat); }
  /* Andere Häuser holen auf */
  hausPokalSimulieren();
  sichern();
}

function hausPokalSimulieren(){
  const werte = HAUS_IDS.map(h => S.hauspunkte[h]);
  const max = Math.max.apply(null, werte);
  HAUS_IDS.forEach(h => {
    if(h === S.haus) return;
    const rueckstand = max - S.hauspunkte[h];
    const grund = zufallInt(18, 52);
    const aufholen = Math.round(rueckstand * 0.16);
    S.hauspunkte[h] += grund + aufholen;
  });
}

function pokalWoche(){
  /* Alle 7 Sitzungen: Sieger küren */
  if(S.sitzungen - S.wocheSitzung < 7) return false;
  S.wocheSitzung = S.sitzungen;
  let sieger = HAUS_IDS[0];
  HAUS_IDS.forEach(h => { if(S.hauspunkte[h] > S.hauspunkte[sieger]) sieger = h; });
  S.letzterSieger = sieger;
  const eigen = sieger === S.haus;
  const belohnung = eigen ? 150 : 40;
  S.steine += belohnung; S.gesamt += belohnung;
  /* Neue Woche: Punkte werden zurückgesetzt, Startvorsprung bleibt spürbar */
  HAUS_IDS.forEach(h => { S.hauspunkte[h] = 100 + Math.round(S.hauspunkte[h]*0.05); });
  sichern();
  const h = HAEUSER[sieger];
  const d = dialog('<div class="zentriert gross-moment">'+
    '<div class="hand" style="font-size:1.3rem;color:#8E7318">Ende der Schulwoche</div>'+
    '<div class="wappenrahmen" style="width:104px;height:104px">'+wappen(sieger,104)+'</div>'+
    '<h2 class="serif" style="color:#20264A;margin:0">'+esc(h.name)+' gewinnt den Hauspokal!</h2>'+
    '<p class="hand" style="font-size:1.2rem;color:#C0492E;margin:4px 0 8px">„'+esc(h.motto)+'"</p>'+
    '<p style="color:#5A6288;font-size:.92rem;margin:0 0 10px">'+
      (eigen ? 'Das ist <b>dein</b> Haus. Die ganze Halle jubelt.' : 'Nächste Woche seid ihr dran.')+'</p>'+
    '<span class="chip">+'+belohnung+' Mondsteine</span>'+
    '<div style="margin-top:14px"><button class="btn" data-zu>Neue Woche beginnen</button></div></div>',
    {klickAussen:false});
  return true;
}

/* ---------- Eulenpost ---------- */
function postBereit(){ return Date.now() - (S.letztePost||0) >= 20*3600*1000; }
function postHolen(){
  if(!postBereit()) return;
  const abstand = Date.now() - (S.letztePost||0);
  S.serie = (S.letztePost && abstand < 48*3600*1000) ? S.serie+1 : 1;
  S.letztePost = Date.now();
  let mult = 1;
  if(S.serie >= 7) mult = 2.5; else if(S.serie >= 5) mult = 2; else if(S.serie >= 3) mult = 1.5;
  const steine = Math.round(zufallInt(25,45) * mult);
  const zutat = zufall(ZUTATEN);
  S.steine += steine; S.gesamt += steine;
  gibZutat(zutat.id, 2);
  let extra = '';
  if(S.serie === 7 || (S.serie > 7 && S.serie % 7 === 0)){
    const offen = WESEN.filter(w => !S.wesen[w.id]);
    if(offen.length){
      const w = zufall(offen.filter(x=>x.selten>=3).length ? offen.filter(x=>x.selten>=3) : offen);
      gibWesen(w.id);
      extra = '<div class="chip" style="margin-top:6px">Seltenes Wesen: '+esc(w.name)+'</div>';
    }
  }
  pruefeAbzeichen(); sichern(); Ton.toll();
  dialog('<div class="zentriert gross-moment">'+
    '<div style="color:#8E7318">'+ico('eule',72)+'</div>'+
    '<h2 class="serif" style="color:#20264A;margin:0">Eulenpost!</h2>'+
    '<p class="hand" style="font-size:1.25rem;color:#C0492E;margin:2px 0 8px">'+
      S.serie+' '+(S.serie===1?'Tag':'Tage')+' in Folge'+(S.serie>=3?' · ×'+mult:'')+'</p>'+
    '<div class="reihe"><span class="chip">+'+steine+' Mondsteine</span>'+
      '<span class="chip">2× '+esc(zutat.name)+'</span></div>'+extra+
    '<p class="klein" style="color:#5A6288;margin:10px 0 12px">Komm morgen wieder — dann wird der Umschlag dicker.</p>'+
    '<button class="btn" data-zu>Danke, Eule</button></div>',
    { beimSchliessen: hubZeigen });
}

/* ---------- HUB ---------- */
function hubZeigen(){
  sitzungStarten();
  const s = $('#szene-hub');
  const trankStufe = S.trankStufe;
  const waldOffen = heute() > (S.letzterWald||0);
  const postOffen = postBereit();
  const kapOffen = KAPITEL.findIndex(k => k.nr === S.kapitel+1 && fortschrittZahl() >= k.ab) >= 0;

  s.innerHTML =
    '<div class="kopf" data-kopf></div>'+
    '<div class="rollen">'+
      '<div class="plan">'+
        '<div class="plan-kopf">'+
          '<div class="gotisch">Mondstein-Akademie</div>'+
          '<div class="hand">Schultag '+S.sitzungen+' · Dein Stundenplan</div>'+
          '<svg viewBox="0 0 300 20" style="width:min(300px,80%);height:20px;margin-top:2px" fill="none" class="zeichnen" aria-hidden="true">'+

function eulenHinweis(){
  const b = document.querySelector('[data-wz="post"]');

}

function fachOeffnen(id){
  Ton.klick();
  if(id==='trank'){ zeige('trank'); trankStarten(S.trankStufe, false); }
  if(id==='flug'){ zeige('flug'); flugStarten(); }
  if(id==='quiz'){ zeige('quiz'); quizStarten(); }
  if(id==='wald'){ zeige('wald'); waldStarten(); }
}
function werkzeugOeffnen(id){
  Ton.klick();
  if(id==='post'){ postBereit() ? postHolen() : postWarten(); }
  if(id==='pokal') pokalZeigen();
  if(id==='album'){ zeige('album'); albumZeigen('traenke'); }
  if(id==='laden'){ zeige('laden'); ladenZeigen('besen'); }
  if(id==='kammer'){ zeige('kammer'); kammerZeigen(); }
  if(id==='geschichte'){ zeige('geschichte'); geschichteZeigen(); }
  if(id==='abzeichen'){ zeige('abzeichen'); abzeichenZeigenAlle(); }
  if(id==='hilfe') hilfeZeigen();
}
function postWarten(){
  const rest = 20*3600*1000 - (Date.now() - (S.letztePost||0));

/* ---------- ZAUBERFORMELN (Runenquiz) ---------- */
const Q = { fragen:[], i:0, richtig:0, zeit:30, timer:null, aktiv:false };
function quizStarten(){
  const gemischt = mischen(RUNEN);
  Q.fragen = gemischt.slice(0,6).map((r,i)=>{
    const falsche = mischen(RUNEN.filter(x=>x.id!==r.id)).slice(0,3);
    return { rune:r, richtungRune: i%2===0, optionen: mischen([r].concat(falsche)) };
  });
  Q.i = 0; Q.richtig = 0; Q.zeit = 30; Q.aktiv = true;
  quizFrage();
  clearInterval(Q.timer);
  Q.timer = setInterval(()=>{
    if(!Q.aktiv) return;
    Q.zeit -= 0.1;
    const b = $('#qZeit');
    if(b) b.firstElementChild.style.width = Math.max(0, Q.zeit/30*100)+'%';
    if(Q.zeit <= 0){ clearInterval(Q.timer); quizEnde(); }
  }, 100);
}
beimVerlassen['quiz'] = ()=>{ Q.aktiv = false; clearInterval(Q.timer); };

function runeSvg(r, groesse, farbe){
  return '<svg width="'+groesse+'" height="'+groesse+'" viewBox="0 0 24 24" fill="none" stroke="'+(farbe||'currentColor')+
    '" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+r.d+'"/></svg>';
}
function quizFrage(){
  if(Q.i >= Q.fragen.length){ quizEnde(); return; }
  const f = Q.fragen[Q.i];
  const s = $('#szene-quiz');
  s.innerHTML =
    '<div class="kopf" data-kopf data-zurueck="1"></div>'+
    '<div class="hud"><span class="chip">Frage '+(Q.i+1)+' / 6</span>'+
      '<div class="zeitbalken" id="qZeit"><i style="width:'+(Q.zeit/30*100)+'%"></i></div>'+
      '<span class="chip">'+Q.richtig+' richtig</span></div>'+
    '<div class="mitte">'+
      (f.richtungRune
        ? '<div class="blatt" style="width:auto;padding:18px 26px"><span class="band l"></span>'+
            '<div style="color:#20264A">'+runeSvg(f.rune, 78, '#20264A')+'</div></div>'+
          '<h2 class="serif" style="font-size:1.15rem;margin:12px 0 0">Was bedeutet diese Rune?</h2>'
        : '<h2 class="serif" style="font-size:1.3rem;margin:0">Welche Rune heißt <span class="gold">'+esc(f.rune.name)+'</span>?</h2>')+
      '<div class="'+(f.richtungRune?'wahlliste':'raster z4')+'" id="qWahl" style="'+(f.richtungRune?'':'max-width:340px;margin-top:14px;width:100%')+'">'+
        f.optionen.map(o => f.richtungRune
          ? '<button class="wahl zentriert" data-id="'+o.id+'">'+esc(o.name)+'</button>'
          : '<button class="karte" data-id="'+o.id+'" aria-label="Rune '+esc(o.name)+'">'+runeSvg(o, 40)+'</button>'
        ).join('')+
      '</div>'+
      '<div class="hand" style="margin-top:14px;font-size:1.1rem;color:var(--haus2)">Sechzehn Runen — du schaffst das.</div>'+
    '</div>';
  kopfAktualisieren();
  s.querySelectorAll('[data-id]').forEach(b => b.onclick = ()=>{
    if(!Q.aktiv) return;
    const ok = b.dataset.id === f.rune.id;
    b.classList.add(ok?'richtig':'falsch');
    if(ok){ Q.richtig++; Ton.gut(); }
    else {
      Ton.schlecht();
      const r = s.querySelector('[data-id="'+f.rune.id+'"]');
      if(r) r.classList.add('richtig');
    }
    s.querySelectorAll('[data-id]').forEach(x => x.disabled = true);
    setTimeout(()=>{ Q.i++; quizFrage(); }, 620);
  });
}
function quizEnde(){
  Q.aktiv = false; clearInterval(Q.timer);
  const perfekt = Q.richtig === 6;
  if(perfekt) S.stats.quizPerfekt++;
  S.quizBest = Math.max(S.quizBest||0, Q.richtig);
  let steine = Q.richtig * 8 + (perfekt?24:0);
  if(S.ereignis && S.ereignis.effekt.runenBonus) steine = Math.round(steine*1.5);
  S.steine += steine; S.gesamt += steine;
  const echteP = gibHauspunkte(Q.richtig*3 + (perfekt?10:0));
  pruefeAbzeichen(); sichern();
  perfekt ? Ton.toll() : Ton.gut();
  const d = dialog('<div class="zentriert gross-moment">'+
    (perfekt?'<div class="hand" style="font-size:1.5rem;color:#8E7318">Alles richtig!</div>':'')+
    '<h2 class="serif" style="color:#20264A;margin:2px 0">'+Q.richtig+' von 6</h2>'+
    '<p class="hand" style="font-size:1.15rem;color:#C0492E;margin:0 0 8px">'+
      (perfekt?'Professorin Mohnfeld nickt anerkennend.':'Beim nächsten Mal klappt es besser.')+'</p>'+
    '<div class="reihe"><span class="chip">+'+steine+' Mondsteine</span><span class="chip">+'+echteP+' Hauspunkte</span></div>'+
    '<div class="reihe" style="margin-top:14px"><button class="btn" data-nochmal>Noch einmal</button>'+
    '<button class="btn geist" data-hub style="color:#20264A;border-color:rgba(40,60,110,.4)">Zum Plan</button></div></div>',
    {klickAussen:false});
  d.el.querySelector('[data-nochmal]').onclick = ()=>{ Ton.klick(); d.schliessen(); quizStarten(); };
  d.el.querySelector('[data-hub]').onclick = ()=>{ Ton.klick(); d.schliessen(); hubZeigen(); };
}

function waldSuchen(ortId){

      '<div class="raster z3" id="wFelder" style="margin-top:12px">'+
        felder.map((n,i)=>'<button class="karte" data-feld="'+i+'" style="aspect-ratio:1;display:grid;place-items:center" aria-label="Busch '+(i+1)+' durchsuchen">'+
          '<span style="color:var(--haus)">'+ico('blatt',36)+'</span></button>').join('')+
      '</div>'+
      '<div id="wFunde" style="margin-top:14px"></div>'+
      '<div class="zentriert" style="margin-top:16px"><button class="btn" id="wFertig" style="display:none">Zurück zur Akademie</button></div>'+
    '</div></div>';
  kopfAktualisieren();
  s.querySelectorAll('[data-feld]').forEach(b => b.onclick = ()=>waldFeld(b));
  $('#wFertig').onclick = ()=>{ Ton.klick(); hubZeigen(); };
}
function waldFeld(b){
  if(W.offen <= 0 || b.disabled) return;
  b.disabled = true; W.offen--;
  Ton.blubb();
  const glueck = S.ereignis && S.ereignis.effekt.waldGlueck;
  const w = Math.random() * (glueck ? .78 : 1);
  let inhalt = '';
  if(w < 0.30){
    const offene = WESEN.filter(x => !S.wesen[x.id]);
    const kandidaten = offene.length ? offene : WESEN;
    const gewicht = [];
    kandidaten.forEach(x => { const n = 5 - x.selten; for(let i=0;i<n*n;i++) gewicht.push(x); });
    const wesen = zufall(gewicht);
    const neu = gibWesen(wesen.id);
    inhalt = '<span style="color:'+wesen.farbe+'">'+ico(wIco(wesen.id),34)+'</span>'+
      '<div class="nm">'+esc(nm(wesen.name))+'</div><div class="pr selten'+wesen.selten+'">'+SELTEN_NAME[wesen.selten]+(neu?' · neu!':'')+'</div>';
    W.funde.push((neu?'Neu entdeckt: ':'Wieder getroffen: ')+wesen.name);
    neu ? Ton.toll() : Ton.gut();
  } else if(w < 0.86){
    const z = zufall(ZUTATEN); const n = zufallInt(1,3);
    gibZutat(z.id, n);
    inhalt = '<span style="color:'+z.farbe+'">'+ico(z.icon,34)+'</span><div class="nm">'+esc(nm(z.name))+'</div><div class="pr">×'+n+'</div>';
    W.funde.push(n+'× '+z.name);
  } else {
    const m = zufallInt(10,30);
    S.steine += m; S.gesamt += m; kopfAktualisieren();
    inhalt = '<span style="color:var(--messing-hell)">'+ico('mondstein',34)+'</span><div class="nm">Mondsteine</div><div class="pr">+'+m+'</div>';
    W.funde.push('+'+m+' Mondsteine');
    Ton.muenze();
  }
  b.innerHTML = inhalt; b.classList.add('hat');
  const r = $('#wRest'); if(r) r.textContent = W.offen+' '+(W.offen===1?'Versuch':'Versuche');
  if(W.offen <= 0){
    S.letzterWald = heute();
    gibHauspunkte(12);
    pruefeAbzeichen(); sichern();
    document.querySelectorAll('[data-feld]').forEach(x => x.disabled = true);
    const f = $('#wFunde');
    if(f) f.innerHTML = '<div class="blatt"><span class="band l"></span>'+
      '<div class="hand" style="font-size:1.2rem;color:#8E7318">Dein Korb</div>'+
      '<ul style="margin:4px 0 0;padding-left:18px;color:#20264A;font-size:.94rem;line-height:1.6">'+
      W.funde.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+
      '<div class="hand" style="color:#C0492E;margin-top:6px">Morgen kannst du wieder los.</div></div>';
    const btn = $('#wFertig'); if(btn) btn.style.display = 'inline-flex';
  }
}

/* ---------- ZAUBERLADEN ---------- */
const LADEN_GRUPPEN = [
  { id:'besen',  name:'Besen',      liste:()=>BESEN,        besitz:()=>S.besitz.besen,     aktiv:()=>S.aktiv.besen,     icon:'besen' },
  { id:'stab',   name:'Stab-Formen',liste:()=>STAEBE_LOOK,  besitz:()=>S.besitz.staebe,    aktiv:()=>S.aktiv.stab,      icon:'rune' },
  { id:'tier',   name:'Begleiter',  liste:()=>BEGLEITER,    besitz:()=>S.besitz.begleiter, aktiv:()=>S.aktiv.begleiter, icon:'pfote' },
  { id:'umhang', name:'Umhänge',    liste:()=>UMHAENGE,     besitz:()=>S.besitz.umhaenge,  aktiv:()=>S.aktiv.umhang,    icon:'schild' },
  { id:'kleber', name:'Kessel',     liste:()=>AUFKLEBER,    besitz:()=>S.besitz.aufkleber, aktiv:()=>S.aktiv.aufkleber, icon:'kessel' }
];
function preisMit(p){
  if(S.ereignis && S.ereignis.effekt.rabatt) return Math.round(p*0.8);
  return p;
}
function ladenZeigen(gruppeId){
  const g = LADEN_GRUPPEN.find(x=>x.id===gruppeId) || LADEN_GRUPPEN[0];
  const liste = g.liste(), besitz = g.besitz(), aktiv = g.aktiv();
  const rabatt = S.ereignis && S.ereignis.effekt.rabatt;
  const s = $('#szene-laden');
  s.innerHTML =
    '<div class="kopf" data-kopf data-zurueck="1"></div>'+
    '<div class="rollen"><div class="abschnitt">'+
      '<div class="titelzeile"><h2>Zauberladen</h2>'+(rabatt?'<span class="chip">−20 % heute</span>':'')+'</div>'+
      '<div class="reiter">'+ LADEN_GRUPPEN.map(x=>
        '<button data-gruppe="'+x.id+'" class="'+(x.id===g.id?'an':'')+'">'+x.name+'</button>').join('') +'</div>'+
      '<div class="raster z2">'+ liste.map(a=>{
        const hat = besitz.indexOf(a.id) >= 0;
        const anAn = aktiv === a.id;
        const preis = preisMit(a.preis);
        const zuTeuer = !hat && S.steine < preis;
        return '<button class="karte '+(anAn?'an':(hat?'hat':''))+'" data-kauf="'+a.id+'" data-gruppe2="'+g.id+'" style="text-align:left;padding:13px'+(zuTeuer?';opacity:.62':'')+'">'+
          '<div style="display:flex;align-items:center;gap:8px">'+
            '<span style="color:'+(a.farbe||'var(--messing-hell)')+'">'+ico(g.icon,30)+'</span>'+
            '<span style="font-weight:800;font-size:.95rem">'+esc(nm(a.name))+'</span></div>'+
          '<div class="hand" style="font-size:1rem;color:var(--messing-hell);text-align:left;margin-top:2px;line-height:1.2">'+esc(a.text)+'</div>'+
          (g.id==='besen' ? '<div class="klein" style="opacity:.85;margin-top:4px">Tempo '+Math.round(a.tempo*100)+' · Wendigkeit '+Math.round(a.wendig*100)+'</div>' : '')+
          '<div class="pr" style="text-align:left;margin-top:5px">'+
            (anAn ? 'in Gebrauch' : hat ? 'anlegen' : preis+' Mondsteine'+(rabatt&&a.preis?' <s style="opacity:.6">'+a.preis+'</s>':''))+
          '</div></button>';
      }).join('') +'</div>'+
      '<p class="hand zentriert" style="font-size:1.15rem;color:var(--haus2);margin-top:16px">'+
        'Alles, was du kaufst, siehst du in deiner Kammer.</p>'+
    '</div></div>';
  kopfAktualisieren();
  s.querySelectorAll('[data-gruppe]').forEach(b => b.onclick = ()=>{ Ton.klick(); ladenZeigen(b.dataset.gruppe); });
  s.querySelectorAll('[data-kauf]').forEach(b => b.onclick = ()=>{ kaufen(b.dataset.kauf, b.dataset.gruppe2); });
}
function alleSachen(){ return BESEN.concat(STAEBE_LOOK, BEGLEITER, UMHAENGE, AUFKLEBER); }
function besitzListeFuer(id){
  if(BESEN.some(x=>x.id===id)) return {liste:S.besitz.besen, feld:'besen'};
  if(STAEBE_LOOK.some(x=>x.id===id)) return {liste:S.besitz.staebe, feld:'stab'};
  if(BEGLEITER.some(x=>x.id===id)) return {liste:S.besitz.begleiter, feld:'begleiter'};
  if(UMHAENGE.some(x=>x.id===id)) return {liste:S.besitz.umhaenge, feld:'umhang'};
  return {liste:S.besitz.aufkleber, feld:'aufkleber'};
}
function ausruesten(id){
  const b = besitzListeFuer(id);
  if(b.liste.indexOf(id) < 0) return;
  S.aktiv[b.feld] = id;
  Ton.auf(); sichern();
}
function kaufen(id, gruppeId){
  const a = alleSachen().find(x=>x.id===id);
  const b = besitzListeFuer(id);
  if(b.liste.indexOf(id) >= 0){ ausruesten(id); ladenZeigen(gruppeId); return; }
  const preis = preisMit(a.preis);
  if(S.steine < preis){
    Ton.schlecht();
    dialog('<div class="zentriert"><div class="hand" style="font-size:1.3rem;color:#C0492E">Noch nicht genug</div>'+
      '<p style="color:#20264A;margin:6px 0 10px">Dir fehlen <b>'+(preis-S.steine)+'</b> Mondsteine. '+
      'Braue einen Trank oder flieg eine Runde — das geht schnell.</p>'+
      '<button class="btn" data-zu>Alles klar</button></div>');
    return;
  }
  S.steine -= preis;
  b.liste.push(id);
  S.aktiv[b.feld] = id;
  pruefeAbzeichen(); sichern(); Ton.toll();
  fliegMitte('Gekauft!', '#8FE08A');
  ladenZeigen(gruppeId);
}

function kapitelLesen(nr){
  Ton.klick();
  const k = KAPITEL[nr-1];
  const s = $('#szene-geschichte');
  s.innerHTML =
    '<div class="kopf" data-kopf data-zurueck="1"></div>'+
    '<div class="rollen"><div class="abschnitt">'+
      '<div class="blatt liniert"><span class="band l"></span><span class="band r"></span><span class="rand"></span>'+
        '<div class="hand" style="font-size:1.2rem;color:#8E7318;padding-left:14px">Kapitel '+k.nr+'</div>'+
        '<h2 class="serif" style="color:#20264A;padding-left:14px;font-size:1.3rem">'+esc(k.titel)+'</h2>'+
        '<div style="color:#20264A;font-size:1.02rem;line-height:1.75;padding-left:14px">'+
          k.text.map(t=>'<p style="margin:0 0 6px">'+esc(t)+'</p>').join('')+'</div>'+
      '</div>'+
      '<h3 class="serif zentriert" style="margin:16px 0 4px;font-size:1.1rem">Was tust du?</h3>'+
      '<div class="wahlliste" id="kapWahl">'+
        k.wahl.map((w,i)=>'<button class="wahl" data-w="'+i+'">'+esc(w.text)+'</button>').join('')+
      '</div>'+
    '</div></div>';
  kopfAktualisieren();
  s.querySelectorAll('[data-w]').forEach(b => b.onclick = ()=>kapitelWahl(nr, +b.dataset.w));
}
function kapitelWahl(nr, i){
  const k = KAPITEL[nr-1], w = k.wahl[i];
  Ton.gut();
  const neu = S.kapitel < nr;
  let belohnungen = [];
  if(neu){
    if(w.effekt.steine){ S.steine += w.effekt.steine; S.gesamt += w.effekt.steine; belohnungen.push('+'+w.effekt.steine+' Mondsteine'); }
    if(w.effekt.hauspunkte){ const p = gibHauspunkte(w.effekt.hauspunkte); belohnungen.push('+'+p+' Hauspunkte'); }
    if(w.effekt.zutat){ const z = zufall(ZUTATEN); gibZutat(z.id,2); belohnungen.push('2× '+z.name); }
    if(w.effekt.spur && S.spuren.indexOf(w.effekt.spur)<0){ S.spuren.push(w.effekt.spur); belohnungen.push('Eine Spur mehr im Heft'); }
    S.kapitel = nr;
    pruefeAbzeichen(); sichern();
  }
  const fest = (nr === 8 && neu);
  if(fest){ S.jahr2 = true; sichern(); }
  const d = dialog('<div class="zentriert gross-moment">'+
    '<p class="hand" style="font-size:1.35rem;color:#C0492E;margin:0 0 10px">'+esc(w.folge)+'</p>'+
    (belohnungen.length?'<div class="reihe">'+belohnungen.map(b=>'<span class="chip">'+esc(b)+'</span>').join('')+'</div>':'')+
    (fest?'<div class="trenner"></div>'+
      '<div class="gotisch" style="font-size:1.5rem;color:#20264A">Jahresabschlussfest</div>'+
      '<p style="color:#20264A;margin:4px 0 8px">Der Hauspokal ist vergeben, der Mondstein leuchtet, und im Fenster '+
      'steht ein Kitz aus Mondstein.</p>'+
      '<p class="hand" style="font-size:1.25rem;color:#8E7318">Jahr 2 ist ab jetzt offen — mit schwereren Stunden.</p>':'')+
    '<div style="margin-top:14px"><button class="btn" data-zu>Weiter</button></div></div>',
    { beimSchliessen: ()=>{ zeige('geschichte',true); geschichteZeigen(); } });
  if(fest) Ton.stufe();
}

      ABZEICHEN.map(a=>{
        const hat = !!S.abzeichen[a.id];
        return '<div class="abz '+(hat?'hat':'')+'"><span class="med">'+ico(hat?a.icon:'frage',24)+'</span>'+
          '<span><span class="nm">'+(hat?esc(a.name):'Noch geheim')+'</span>'+
          '<div class="bs">'+esc(a.text)+'</div></span></div>';
      }).join('')+
    '</div></div>';
  kopfAktualisieren();
}

/* ============================================================
   START
   ============================================================ */

function kerzenBauen(){
  const k = $('#kerzen');
  if(!k) return;
  let h = '';
  for(let i=0;i<14;i++){
    h += '<i class="kerze" style="left:'+(Math.random()*100).toFixed(1)+'%;'+
      'animation-duration:'+(14+Math.random()*14).toFixed(1)+'s;'+
      'animation-delay:'+(-Math.random()*22).toFixed(1)+'s;'+
      'transform:scale('+(0.6+Math.random()*0.8).toFixed(2)+')"></i>';
  }
  k.innerHTML = h;
}

function standMischen(gespeichert){
  const frisch = neuerStand();
  if(!gespeichert || typeof gespeichert !== 'object') return frisch;
  const ziel = Object.assign({}, frisch, gespeichert);
  /* Verschachteltes zusammenführen, damit alte Spielstände nicht brechen */
  ziel.hauspunkte = Object.assign({}, frisch.hauspunkte, gespeichert.hauspunkte||{});
  ziel.besitz = Object.assign({}, frisch.besitz, gespeichert.besitz||{});
  ziel.aktiv = Object.assign({}, frisch.aktiv, gespeichert.aktiv||{});
  ziel.stats = Object.assign({}, frisch.stats, gespeichert.stats||{});
  ['besen','staebe','begleiter','umhaenge','aufkleber'].forEach(k=>{
    if(!Array.isArray(ziel.besitz[k])) ziel.besitz[k] = frisch.besitz[k].slice();
  });
  if(!Array.isArray(ziel.spuren)) ziel.spuren = [];
  ziel.traenke = gespeichert.traenke || {};
  ziel.wesen = gespeichert.wesen || {};
  ziel.zutaten = gespeichert.zutaten || {};
  ziel.abzeichen = gespeichert.abzeichen || {};
  return ziel;
}

(async function start(){
  kerzenBauen();
  let gespeichert = null;
  try{ gespeichert = await Speicher.laden(); }catch(e){ gespeichert = null; }
  S = standMischen(gespeichert);

  hausfarbeSetzen();
  kopfAktualisieren();

  const anTon = ()=>{ Ton.start(); };
  document.addEventListener('pointerdown', anTon, {once:true});
  document.addEventListener('keydown', anTon, {once:true});

  if(S.haus && S.name){
    hubZeigen();
  } else {
    ankunftAufbauen();
    zeige('ankunft', true);
  }

  window.addEventListener('beforeunload', ()=>{ try{ Speicher.sichern(S); }catch(e){} });
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) sofortSichern(); });
})();

</script>
